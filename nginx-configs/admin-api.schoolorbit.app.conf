map $http_origin $admin_allow_origin {
    default "";
    "https://admin.schoolorbit.app" $http_origin;
    "https://schoolorbit.app" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
}

server {
    listen 80;
    server_name admin-api.schoolorbit.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin-api.schoolorbit.app;

    # The production bootstrap requests one certificate containing both API names.
    ssl_certificate /etc/letsencrypt/live/school-api.schoolorbit.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school-api.schoolorbit.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header Access-Control-Allow-Origin $admin_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Cookie,X-Requested-With" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Internal-Secret $http_x_internal_secret;
    proxy_set_header X-Internal-Caller $http_x_internal_caller;
    proxy_pass_header Set-Cookie;

    # Internal credentials are headers, but disable access logs for the entire
    # internal surface so later query parameters cannot leak operational data.
    location ^~ /internal/ {
        access_log off;
        proxy_pass http://schoolorbit-backend-admin:8080;
    }

    location / {
        proxy_pass http://schoolorbit-backend-admin:8080;
    }
}
