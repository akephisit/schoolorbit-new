# Production compose สำหรับ Podman
# ใช้ pre-built images จาก ghcr.io — ไม่มี local postgres (ใช้ Neon)
# รัน: podman-compose up -d
# env vars อ่านจาก .env ไฟล์ในโฟลเดอร์นี้

services:
  backend-admin:
    image: ghcr.io/akephisit/schoolorbit-backend-admin:latest
    container_name: schoolorbit-backend-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Admin database (Neon)
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

      # Backend-School communication
      BACKEND_SCHOOL_URL: ${BACKEND_SCHOOL_URL:-http://schoolorbit-backend-school:8081}

      # Neon (tenant database provisioning)
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      NEON_BRANCH_ID: ${NEON_BRANCH_ID:-main}
      NEON_HOST: ${NEON_HOST}
      NEON_DB_PASSWORD: ${NEON_DB_PASSWORD}

      # Cloudflare (Workers deployment & DNS)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      BASE_DOMAIN: ${BASE_DOMAIN:-schoolorbit.app}

      # GitHub Actions deployment
      API_URL: ${API_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-akephisit/schoolorbit-new}

      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - schoolorbit-net

  backend-school:
    image: ghcr.io/akephisit/schoolorbit-backend-school:latest
    container_name: schoolorbit-backend-school
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      HOST: 0.0.0.0
      PORT: "8081"

      # ไม่มี ADMIN_DATABASE_URL — เรียก backend-admin ผ่าน HTTP แทน
      BACKEND_ADMIN_URL: ${BACKEND_ADMIN_URL:-http://schoolorbit-backend-admin:8080}
      BACKEND_ADMIN_REQUEST_TIMEOUT_MS: ${BACKEND_ADMIN_REQUEST_TIMEOUT_MS:-5000}
      BACKEND_ADMIN_RETRY_MAX_ATTEMPTS: ${BACKEND_ADMIN_RETRY_MAX_ATTEMPTS:-3}
      BACKEND_ADMIN_RETRY_BASE_DELAY_MS: ${BACKEND_ADMIN_RETRY_BASE_DELAY_MS:-100}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      DEPLOY_KEY: ${DEPLOY_KEY:-local-dev-key-change-me}

      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_REGION: ${R2_REGION:-auto}
      AWS_REGION: auto

      # File Platform scanner and lifecycle controls
      CLAMD_ENDPOINT: ${CLAMD_ENDPOINT:-clamd:3310}
      CLAMD_CONNECT_TIMEOUT_MS: ${CLAMD_CONNECT_TIMEOUT_MS:-1000}
      CLAMD_WRITE_TIMEOUT_MS: ${CLAMD_WRITE_TIMEOUT_MS:-10000}
      CLAMD_READ_TIMEOUT_MS: ${CLAMD_READ_TIMEOUT_MS:-30000}
      CLAMD_MAX_CHUNK_BYTES: ${CLAMD_MAX_CHUNK_BYTES:-65536}
      CLAMD_MAX_RESPONSE_BYTES: ${CLAMD_MAX_RESPONSE_BYTES:-4096}
      CLAMD_MAX_CONCURRENT_SCANS: ${CLAMD_MAX_CONCURRENT_SCANS:-8}
      FILE_PRIVATE_GRANT_TTL_SECONDS: ${FILE_PRIVATE_GRANT_TTL_SECONDS:-120}
      FILE_RECONCILE_LEASE_SECONDS: ${FILE_RECONCILE_LEASE_SECONDS:-60}
      FILE_RECONCILE_BATCH_SIZE: ${FILE_RECONCILE_BATCH_SIZE:-25}
      FILE_RECONCILE_MAX_ATTEMPTS: ${FILE_RECONCILE_MAX_ATTEMPTS:-8}
      FILE_RECONCILE_RETRY_BASE_SECONDS: ${FILE_RECONCILE_RETRY_BASE_SECONDS:-5}
      FILE_RECONCILE_RETRY_MAX_SECONDS: ${FILE_RECONCILE_RETRY_MAX_SECONDS:-3600}

      # File Upload Limits
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      MAX_PROFILE_IMAGE_SIZE_MB: ${MAX_PROFILE_IMAGE_SIZE_MB:-5}
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-20}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-jpg,jpeg,png,webp,gif}
      ALLOWED_DOCUMENT_TYPES: ${ALLOWED_DOCUMENT_TYPES:-pdf,doc,docx,xls,xlsx}

      # Web Push
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@schoolorbit.app}

      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ready"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    depends_on:
      backend-admin:
        condition: service_healthy
      clamd:
        condition: service_healthy
    networks:
      - schoolorbit-net
      - file-platform-internal

  clamd:
    image: docker.io/clamav/clamav-debian:1.5.3
    container_name: schoolorbit-clamd
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks:
      - file-platform-internal
      - clamav-egress
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 18
      start_period: 6m
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  nginx:
    image: docker.io/library/nginx:stable-alpine
    container_name: schoolorbit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - schoolorbit-net

volumes:
  clamav_signatures:
    name: schoolorbit-clamav-signatures

networks:
  schoolorbit-net:
    name: schoolorbit-web
    driver: bridge
  file-platform-internal:
    name: schoolorbit-file-platform-internal
    internal: true
  clamav-egress:
    name: schoolorbit-clamav-egress
    driver: bridge
