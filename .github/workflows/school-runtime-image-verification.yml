name: School runtime image verification
on:
  push:
    branches: [perf/school-ci-cache-reuse]
    paths: [.github/workflows/school-runtime-image-verification.yml]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Build and inspect the candidate runtime image
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/school-runtime-context"
          mkdir -p "$context"
          git archive HEAD backend-school | tar -x -C "$context" --strip-components=1
          printf '\n// CI cache measurement: cache-prime\n' >>"$context/src/main.rs"
          docker buildx build --progress=plain --target runtime --load \
            --tag school-runtime:verification --build-arg SCHOOL_COMPILER_CACHE=gha \
            --secret id=sccache_gha_url,env=ACTIONS_RESULTS_URL \
            --secret id=sccache_gha_token,env=ACTIONS_RUNTIME_TOKEN \
            --cache-from type=gha,scope=backend-school-cache-benchmark \
            --cache-from type=gha,scope=backend-school "$context"
          test "$(docker run --rm --network none --entrypoint id school-runtime:verification -u)" = 1000
          docker run --rm --network none school-runtime:verification /app/backend-school export-openapi >"$RUNNER_TEMP/school-api.json"
          docker image inspect school-runtime:verification >"$RUNNER_TEMP/image.json"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP'])
          config = json.loads((directory / 'image.json').read_text())[0]['Config']
          assert config['User'] == 'appuser'
          assert config['Cmd'] == ['/app/backend-school']
          assert not any(value.startswith(('ACTIONS_', 'SCCACHE_', 'RUSTC_WRAPPER=')) for value in config['Env'])
          document = json.loads((directory / 'school-api.json').read_text())
          assert document['openapi'] == '3.1.0' and document['paths']
          print('Runtime image user, command, secret isolation, and offline exporter passed')
          PY
