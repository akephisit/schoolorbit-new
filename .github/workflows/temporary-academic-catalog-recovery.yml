name: Temporary Academic Catalog Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Repair unresolved sandbox subject affiliation
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            runtime_database_url() {
              local line value decoded char
              local -i index=0
              line="$(grep -m 1 '^DATABASE_URL=' /opt/stack/.env)" || return
              value=${line#*=}
              if [[ ${#value} -lt 2 || ${value:0:1} != "'" || ${value: -1} != "'" ]]; then
                echo 'Runtime database URL is not installer encoded' >&2
                return 65
              fi
              value=${value:1:${#value}-2}
              decoded=
              while ((index < ${#value})); do
                char=${value:index:1}
                if [[ $char == \\ ]]; then
                  ((index += 1))
                  if ((index >= ${#value})); then
                    echo 'Runtime database URL has invalid escaping' >&2
                    return 65
                  fi
                  char=${value:index:1}
                  if [[ $char != \\ && $char != "'" ]]; then
                    echo 'Runtime database URL has invalid escaping' >&2
                    return 65
                  fi
                fi
                decoded+=$char
                ((index += 1))
              done
              printf '%s' "$decoded"
            }

            admin_database_url="$(runtime_database_url)"
            test -n "$admin_database_url" || { echo 'Admin database URL is unavailable'; exit 1; }

            tenant_database_url="$(
              podman run --rm docker.io/library/postgres:17-alpine \
                psql "$admin_database_url" -X -A -t -v ON_ERROR_STOP=1 \
                -c "SELECT db_connection_string FROM schools WHERE subdomain = 'sandbox' AND status = 'active' LIMIT 1;"
            )"
            unset admin_database_url
            test -n "$tenant_database_url" || { echo 'Sandbox database URL is unavailable'; exit 1; }

            podman run --rm docker.io/library/postgres:17-alpine \
              psql "$tenant_database_url" -X -A -t -v ON_ERROR_STOP=1 \
              -c "BEGIN;
                  DO \$\$
                  DECLARE
                      target_owner_id UUID;
                      matching_owner_count INTEGER;
                      matching_subject_count INTEGER;
                      repaired_count INTEGER;
                  BEGIN
                      IF EXISTS (
                          SELECT 1 FROM _sqlx_migrations WHERE version >= 59
                      ) THEN
                          RAISE EXCEPTION 'SANDBOX_RECOVERY_SCHEMA_NOT_058';
                      END IF;

                      SELECT count(*), min(unit.id::text)::uuid
                        INTO matching_owner_count, target_owner_id
                        FROM organization_units unit
                        JOIN subject_groups subject_group
                          ON subject_group.id = unit.subject_group_id
                       WHERE unit.code = 'SUBJ-MA'
                         AND unit.is_active IS TRUE
                         AND subject_group.code = 'MA'
                         AND subject_group.is_active IS TRUE;

                      IF matching_owner_count <> 1 OR target_owner_id IS NULL THEN
                          RAISE EXCEPTION 'SANDBOX_RECOVERY_MATH_OWNER_INVALID';
                      END IF;

                      SELECT count(*)
                        INTO matching_subject_count
                        FROM subjects subject
                       WHERE subject.code = 'ค23101'
                         AND subject.owning_organization_unit_id IS NULL
                         AND NOT EXISTS (
                             SELECT 1
                               FROM subject_versions version
                              WHERE version.subject_id = subject.id
                         );

                      IF matching_subject_count <> 1 THEN
                          RAISE EXCEPTION 'SANDBOX_RECOVERY_SUBJECT_PRECONDITION_FAILED';
                      END IF;

                      UPDATE subjects
                         SET owning_organization_unit_id = target_owner_id,
                             row_version = row_version + 1,
                             updated_at = now()
                       WHERE code = 'ค23101'
                         AND owning_organization_unit_id IS NULL;

                      GET DIAGNOSTICS repaired_count = ROW_COUNT;
                      IF repaired_count <> 1 THEN
                          RAISE EXCEPTION 'SANDBOX_RECOVERY_UPDATE_COUNT_INVALID';
                      END IF;
                  END;
                  \$\$;

                  DO \$\$
                  DECLARE
                      unresolved_subject_count INTEGER;
                  BEGIN
                      WITH version_affiliations AS (
                          SELECT version.subject_id,
                                 min(version.group_id::text)::uuid AS subject_group_id
                            FROM subject_versions version
                           WHERE version.group_id IS NOT NULL
                           GROUP BY version.subject_id
                      )
                      SELECT count(*)
                        INTO unresolved_subject_count
                        FROM subjects subject
                        LEFT JOIN version_affiliations version_affiliation
                          ON version_affiliation.subject_id = subject.id
                        LEFT JOIN organization_units owner
                          ON owner.id = subject.owning_organization_unit_id
                        LEFT JOIN subject_groups subject_group
                          ON subject_group.id = COALESCE(
                              version_affiliation.subject_group_id,
                              owner.subject_group_id
                          )
                       WHERE subject_group.id IS NULL
                          OR subject_group.is_active IS NOT TRUE;

                      IF unresolved_subject_count <> 0 THEN
                          RAISE EXCEPTION
                              'SANDBOX_RECOVERY_UNRESOLVED_SUBJECTS:%',
                              unresolved_subject_count;
                      END IF;
                  END;
                  \$\$;
                  COMMIT;

                  SELECT 'sandbox_catalog_recovery=complete unresolved_subjects=0';"
            unset tenant_database_url
