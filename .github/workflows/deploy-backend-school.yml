name: Deploy Backend School

on:
  push:
    branches: ["main"]
    paths:
      - "backend-school/**"
      - "nginx-configs/school-api.schoolorbit.app.conf"
      - "nginx-configs/school-api.schoolorbit.app.maintenance.conf"
      - ".github/workflows/deploy-backend-school.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akephisit/schoolorbit-backend-school

concurrency:
  group: deploy-backend-school
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      # Re-enable Buildx with robust config
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-school
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload backend-school runtime and proxy definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend-school/docker-compose.yml,backend-school/scripts/upgrade_file_platform_env.sh,nginx-configs/school-api.schoolorbit.app.conf,nginx-configs/school-api.schoolorbit.app.maintenance.conf
          target: /opt/stack/file-platform-runtime
          strip_components: 1

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/stack

            runtime_compose=/opt/stack/file-platform-runtime/docker-compose.yml
            runtime_env=/opt/stack/.env
            proxy_source=/opt/stack/file-platform-runtime/school-api.schoolorbit.app.conf
            maintenance_proxy_source=/opt/stack/file-platform-runtime/school-api.schoolorbit.app.maintenance.conf
            test -f "$runtime_compose" || { echo "Backend runtime definition is missing"; exit 1; }
            test -f "$runtime_env" || { echo "Backend runtime environment is missing"; exit 1; }
            test -f "$proxy_source" || { echo "Staged school API proxy config is missing"; exit 1; }
            test -f "$maintenance_proxy_source" || { echo "Staged school API maintenance config is missing"; exit 1; }
            command -v jq >/dev/null || { echo "jq is required for migration verification"; exit 1; }
            proxy_matches="$(grep -l 'server_name school-api\.schoolorbit\.app;' /opt/stack/nginx/conf.d/*.conf 2>/dev/null || true)"
            proxy_match_count="$(printf '%s\n' "$proxy_matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$proxy_match_count" -ne 1 ]; then
              echo "Expected exactly one active school API proxy config, found ${proxy_match_count}"
              exit 1
            fi
            proxy_target="$proxy_matches"
            bash /opt/stack/file-platform-runtime/scripts/upgrade_file_platform_env.sh "$runtime_env"
            for required_name in \
              R2_ACCOUNT_ID \
              R2_ACCESS_KEY_ID \
              R2_SECRET_ACCESS_KEY \
              R2_PUBLIC_BUCKET_NAME \
              R2_PRIVATE_BUCKET_NAME \
              R2_PUBLIC_URL
            do
              if ! grep -Eq "^${required_name}=.+" "$runtime_env"; then
                echo "Missing required File Platform configuration: ${required_name}"
                exit 1
              fi
            done
            public_bucket="$(sed -n 's/^R2_PUBLIC_BUCKET_NAME=//p' "$runtime_env" | tail -n 1)"
            private_bucket="$(sed -n 's/^R2_PRIVATE_BUCKET_NAME=//p' "$runtime_env" | tail -n 1)"
            if [ "$public_bucket" = "$private_bucket" ]; then
              echo "Public and private File Platform buckets must be different"
              exit 1
            fi

            export AWS_ACCESS_KEY_ID="$(sed -n 's/^R2_ACCESS_KEY_ID=//p' "$runtime_env" | tail -n 1)"
            export AWS_SECRET_ACCESS_KEY="$(sed -n 's/^R2_SECRET_ACCESS_KEY=//p' "$runtime_env" | tail -n 1)"
            export AWS_DEFAULT_REGION=auto
            export AWS_EC2_METADATA_DISABLED=true
            r2_account_id="$(sed -n 's/^R2_ACCOUNT_ID=//p' "$runtime_env" | tail -n 1)"
            r2_endpoint="https://${r2_account_id}.r2.cloudflarestorage.com"
            r2_cli() {
              podman run --rm \
                -e AWS_ACCESS_KEY_ID \
                -e AWS_SECRET_ACCESS_KEY \
                -e AWS_DEFAULT_REGION \
                -e AWS_EC2_METADATA_DISABLED \
                docker.io/amazon/aws-cli:2.36.9 \
                --endpoint-url "$r2_endpoint" \
                "$@"
            }
            podman pull docker.io/amazon/aws-cli:2.36.9
            if ! r2_cli s3api head-bucket --bucket "$public_bucket" >/dev/null 2>&1; then
              echo "Configured public File Platform bucket is not accessible"
              exit 1
            fi
            if ! r2_cli s3api head-bucket --bucket "$private_bucket" >/dev/null 2>&1; then
              if ! r2_cli s3api create-bucket --bucket "$private_bucket" >/dev/null; then
                echo "Private File Platform bucket is absent and could not be created"
                exit 1
              fi
            fi
            r2_cli s3api head-bucket --bucket "$private_bucket" >/dev/null

            private_cors_policy='{"CORSRules":[{"AllowedOrigins":["https://*.schoolorbit.app"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["Range"],"ExposeHeaders":["Accept-Ranges","Content-Length","Content-Range","Content-Type","ETag"],"MaxAgeSeconds":3600}]}'
            r2_cli s3api put-bucket-cors \
              --bucket "$private_bucket" \
              --cors-configuration "$private_cors_policy" >/dev/null
            private_cors_origins="$(
              r2_cli s3api get-bucket-cors \
                --bucket "$private_bucket" \
                --query 'CORSRules[0].AllowedOrigins' \
                --output text
            )"
            private_cors_methods="$(
              r2_cli s3api get-bucket-cors \
                --bucket "$private_bucket" \
                --query 'CORSRules[0].AllowedMethods' \
                --output text
            )"
            printf '%s\n' "$private_cors_origins" |
              tr '\t' '\n' |
              grep -Fqx 'https://*.schoolorbit.app'
            for required_method in GET HEAD; do
              printf '%s\n' "$private_cors_methods" |
                tr '\t' '\n' |
                grep -Fqx "$required_method"
            done
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

            ln -sfn "$runtime_env" /opt/stack/file-platform-runtime/.env
            compose() {
              podman-compose -f "$runtime_compose" "$@"
            }
            podman-compose -f "$runtime_compose" --dry-run up -d clamd backend-school >/dev/null

            # The scanner gets an isolated container network and no published port.
            podman pull docker.io/clamav/clamav-debian:1.5.3
            compose up -d clamd
            scanner_ready=false
            for attempt in $(seq 1 60); do
              scanner_status="$(podman inspect --format '{{.State.Health.Status}}' schoolorbit-clamd 2>/dev/null || true)"
              if [ "$scanner_status" = "healthy" ]; then
                scanner_ready=true
                break
              fi
              if [ "$attempt" -lt 60 ]; then
                sleep 10
              fi
            done
            if [ "$scanner_ready" != "true" ]; then
              podman logs --tail 100 schoolorbit-clamd
              exit 1
            fi

            backend_image=ghcr.io/akephisit/schoolorbit-backend-school
            podman pull "${backend_image}:${{ github.sha }}"

            proxy_backup="$(mktemp /opt/stack/nginx/conf.d/.school-api.schoolorbit.app.conf.XXXXXX)"
            cp "$proxy_target" "$proxy_backup"
            cp "$maintenance_proxy_source" "$proxy_target"
            if ! podman exec schoolorbit-nginx nginx -t; then
              cp "$proxy_backup" "$proxy_target"
              rm -f "$proxy_backup"
              echo "School API maintenance proxy configuration is invalid"
              exit 1
            fi
            if ! podman exec schoolorbit-nginx nginx -s reload; then
              cp "$proxy_backup" "$proxy_target"
              podman exec schoolorbit-nginx nginx -t
              podman exec schoolorbit-nginx nginx -s reload || true
              rm -f "$proxy_backup"
              echo "School API could not enter maintenance mode"
              exit 1
            fi

            podman tag "${backend_image}:${{ github.sha }}" "${backend_image}:latest"

            # Recreate backend-school only; do not restart unrelated services.
            podman stop schoolorbit-backend-school || true
            podman rm schoolorbit-backend-school || true
            compose up -d backend-school

            # /ready checks control plane, both R2 buckets, and clamd.
            if ! timeout 180 bash -c '
              for attempt in $(seq 1 36); do
                if curl -fsS "$1" >/dev/null; then
                  exit 0
                fi
                if [ "$attempt" -lt 36 ]; then
                  sleep 5
                fi
              done
              exit 1
            ' _ http://127.0.0.1:8081/ready; then
              podman logs --tail 100 schoolorbit-backend-school
              echo "Cutover image is not ready; maintenance remains enabled and pre-cutover rollback is disabled"
              exit 1
            fi

            migration_response="$(mktemp /opt/stack/.backend-school-migration.XXXXXX)"
            chmod 600 "$migration_response"
            cleanup_migration_response() {
              rm -f "$migration_response"
            }
            trap cleanup_migration_response EXIT

            internal_api_secret="$(
              podman inspect schoolorbit-backend-school \
                --format '{{range .Config.Env}}{{println .}}{{end}}' |
                sed -n 's/^INTERNAL_API_SECRET=//p' |
                tail -n 1
            )"
            if [ -z "$internal_api_secret" ]; then
              echo "Backend internal migration credential is unavailable; maintenance remains enabled"
              exit 1
            fi
            if ! curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 900 \
              -X POST \
              -H "X-Internal-Secret: ${internal_api_secret}" \
              -o "$migration_response" \
              http://127.0.0.1:8081/internal/migrate-all
            then
              echo "Tenant migration request failed; maintenance remains enabled"
              exit 1
            fi
            unset internal_api_secret

            if ! jq -e '
              .latest_version as $latest
              | $latest >= 32
              and .total > 0
              and .failed == 0
              and .success == .total
              and all(
                .results[];
                .version == $latest
                and .error == null
                and (.status == "migrated" or .status == "already_migrated")
              )
            ' "$migration_response" >/dev/null
            then
              echo "Tenant migration verification failed; maintenance remains enabled"
              exit 1
            fi
            rm -f "$migration_response"
            trap - EXIT

            cp "$proxy_source" "$proxy_target"
            if ! podman exec schoolorbit-nginx nginx -t; then
              cp "$proxy_backup" "$proxy_target"
              podman exec schoolorbit-nginx nginx -t
              podman exec schoolorbit-nginx nginx -s reload || true
              rm -f "$proxy_backup"
              echo "Normal school API proxy configuration is invalid after migration"
              exit 1
            fi
            if ! podman exec schoolorbit-nginx nginx -s reload; then
              cp "$proxy_backup" "$proxy_target"
              podman exec schoolorbit-nginx nginx -t
              podman exec schoolorbit-nginx nginx -s reload || true
              rm -f "$proxy_backup"
              exit 1
            fi
            rm -f "$proxy_backup"
            podman tag "${backend_image}:${{ github.sha }}" "${backend_image}:rollback"
