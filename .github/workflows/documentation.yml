name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".rules"
      - ".agents/skills/schoolorbit-workflow/**"
      - ".codex/**"
      - "frontend-school/tests/static/documentation-policy.test.mjs"
      - "frontend-school/tests/static/fixtures/schoolorbit-agent-workflow-scenarios.json"
      - "frontend-school/tests/static/schoolorbit-agent-workflow.test.mjs"
      - "frontend-school/package.json"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".rules"
      - ".agents/skills/schoolorbit-workflow/**"
      - ".codex/**"
      - "frontend-school/tests/static/documentation-policy.test.mjs"
      - "frontend-school/tests/static/fixtures/schoolorbit-agent-workflow-scenarios.json"
      - "frontend-school/tests/static/schoolorbit-agent-workflow.test.mjs"
      - "frontend-school/package.json"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check repository documentation and agent workflow
        run: >-
          node --test
          frontend-school/tests/static/documentation-policy.test.mjs
          frontend-school/tests/static/schoolorbit-agent-workflow.test.mjs
