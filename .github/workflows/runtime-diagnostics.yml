name: Runtime Diagnostics
on:
  workflow_call:
    inputs:
      run_sandbox_probe:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload bounded runtime observation collector
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/lib/pipeline-runtime-observations.py
          target: /opt/stack/deployment
      - name: Measure selected sandbox reads through the public API
        if: github.ref == 'refs/heads/main' && inputs.run_sandbox_probe
        timeout-minutes: 8
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_directory="$(mktemp -d "$RUNNER_TEMP/runtime-probe.XXXXXX")"
          trap 'rm -rf -- "$private_directory"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP
          if ! (
            ulimit -f 2048
            timeout --signal=TERM --kill-after=5s 420s \
              python3 -B scripts/lib/pipeline-runtime-observations.py --sandbox-probe
          ) >"$private_directory/report.json" 2>"$private_directory/stderr"; then
            printf '%s\n' 'runtime_observation_artifact=unavailable reason=probe_failed'
            exit 1
          fi
          python3 -B scripts/lib/pipeline-runtime-observation-artifacts.py probe \
            "$private_directory/report.json" \
            "$RUNNER_TEMP/runtime-observation-artifacts/sandbox-probe.json"
      - name: Collect sanitized runtime observations
        if: always() && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ! $SERVER_IP =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] ||
            [[ ${#SERVER_IP} -gt 253 ]] ||
            [[ ! $SERVER_USER =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] ||
            [[ ! $SERVER_PORT =~ ^[0-9]{1,5}$ ]] ||
            (( 10#$SERVER_PORT < 1 || 10#$SERVER_PORT > 65535 )) ||
            [[ -z $SSH_PRIVATE_KEY ]]; then
            printf '%s\n' 'runtime_observation_artifact=unavailable reason=ssh_configuration_invalid'
            exit 1
          fi
          ssh_directory="$(mktemp -d "$RUNNER_TEMP/runtime-observation-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_directory"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP
          key_file="$ssh_directory/key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$key_file"
          unset SSH_PRIVATE_KEY
          if ! timeout --signal=TERM --kill-after=2s 15s \
            ssh-keyscan -T 5 -p "$SERVER_PORT" -H "$SERVER_IP" \
            >"$known_hosts" 2>"$ssh_directory/keyscan-stderr" || [[ ! -s $known_hosts ]]; then
            printf '%s\n' 'runtime_observation_artifact=unavailable reason=host_key_unavailable'
            exit 1
          fi
          if ! (
            ulimit -f 2048
            timeout --signal=TERM --kill-after=5s 90s \
              ssh -n -T -i "$key_file" -p "$SERVER_PORT" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
                -o UserKnownHostsFile="$known_hosts" \
                "${SERVER_USER}@${SERVER_IP}" \
                'python3 -B /opt/stack/deployment/scripts/lib/pipeline-runtime-observations.py'
          ) >"$ssh_directory/report.json" 2>"$ssh_directory/stderr"; then
            printf '%s\n' 'runtime_observation_artifact=unavailable reason=transport_failed'
            exit 1
          fi
          python3 -B scripts/lib/pipeline-runtime-observation-artifacts.py runtime \
            "$ssh_directory/report.json" \
            "$RUNNER_TEMP/runtime-observation-artifacts/runtime.json"
      - name: Retain validated aggregate JSON
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-observations-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-observation-artifacts/runtime.json
            ${{ runner.temp }}/runtime-observation-artifacts/sandbox-probe.json
      - name: Inspect runtime state
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            podman --version
            podman-compose version
            if podman container exists schoolorbit-clamd; then
              podman inspect --format 'clamd_pids_limit={{.HostConfig.PidsLimit}}' schoolorbit-clamd
              podman inspect --format 'clamd_port_bindings={{json .HostConfig.PortBindings}}' schoolorbit-clamd
              podman port schoolorbit-clamd
              if [ -x /opt/stack/deployment/scripts/clamd_runtime_matches.sh ]; then
                /opt/stack/deployment/scripts/clamd_runtime_matches.sh \
                  docker.io/clamav/clamav-debian:1.5.3 schoolorbit-clamd || true
              fi
            fi
            graph_root="$(podman info --format '{{.Store.GraphRoot}}' 2>/dev/null || true)"
            if [ -n "$graph_root" ]; then
              df -P "$graph_root" || true
            else
              printf '%s\n' 'runtime_storage=status_unavailable reason=graph_root_missing'
            fi
            podman system df || true
            podman system df -v || true
            for repository in \
              ghcr.io/akephisit/schoolorbit-backend-admin \
              ghcr.io/akephisit/schoolorbit-backend-school
            do
              sha_image_count="$(
                podman images --format '{{.Repository}}|{{.Tag}}' "$repository" |
                  awk -F '|' -v repository="$repository" '
                    $1 == repository && length($2) == 40 && $2 !~ /[^0-9a-f]/ { count += 1 }
                    END { print count + 0 }
                  '
              )"
              printf 'runtime_sha_images repository=%s count=%s\n' "$repository" "$sha_image_count"
            done
            unset graph_root sha_image_count repository
            for container in \
              schoolorbit-backend-admin \
              schoolorbit-backend-school \
              schoolorbit-clamd \
              schoolorbit-nginx
            do
              if podman container exists "$container"; then
                podman inspect --format \
                  'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}} aliases={{json $network.Aliases}};{{end}}' \
                  "$container"
              else
                printf 'container=%s status=missing\n' "$container"
              fi
            done
            podman port schoolorbit-nginx || true
            podman inspect --format \
              'nginx_restarts={{.RestartCount}} ports={{json .HostConfig.PortBindings}}' \
              schoolorbit-nginx || true
            podman exec schoolorbit-nginx nginx -t || true
            podman run --rm \
              --network schoolorbit-web \
              -v /opt/stack/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /opt/stack/nginx/ssl:/etc/nginx/ssl:ro \
              docker.io/library/nginx:stable-alpine nginx -t || true
            . /opt/stack/deployment/scripts/lib/pipeline-remote/runtime-env.sh
            PGDATABASE=""
            if [ -r /opt/stack/.env ]; then
              PGDATABASE="$(schoolorbit_runtime_env_value DATABASE_URL /opt/stack/.env)"
            fi
            if [ -n "$PGDATABASE" ]; then
              export PGDATABASE
              podman run --rm -e PGDATABASE \
                -v /opt/stack/postgresql/ca.crt:/run/secrets/postgresql-ca.crt:ro \
                public.ecr.aws/docker/library/postgres:18.6-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66 \
                psql -X -A -t -v ON_ERROR_STOP=1 \
                -c "SELECT pid, state, coalesce(wait_event_type, '-'), coalesce(wait_event, '-'), coalesce(extract(epoch from now() - xact_start)::bigint, 0) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid() ORDER BY pid;" || true
            else
              printf '%s\n' 'database_activity=status_unavailable reason=database_url_missing'
            fi
            unset PGDATABASE
            for endpoint in \
              http://127.0.0.1:8080/health \
              http://127.0.0.1:8080/ready \
              http://127.0.0.1:8081/ready \
              http://127.0.0.1:80/
            do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$endpoint" || true)"
              printf 'endpoint=%s status=%s\n' "$endpoint" "$status"
            done
