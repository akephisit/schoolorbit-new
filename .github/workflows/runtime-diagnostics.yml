name: Runtime Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect runtime state
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            graph_root="$(podman info --format '{{.Store.GraphRoot}}' 2>/dev/null || true)"
            if [ -n "$graph_root" ]; then
              df -P "$graph_root" || true
            else
              printf '%s\n' 'runtime_storage=status_unavailable reason=graph_root_missing'
            fi
            podman system df || true
            podman system df -v || true
            for repository in \
              ghcr.io/akephisit/schoolorbit-backend-admin \
              ghcr.io/akephisit/schoolorbit-backend-school
            do
              sha_image_count="$(
                podman images --format '{{.Repository}}|{{.Tag}}' "$repository" |
                  awk -F '|' -v repository="$repository" '
                    $1 == repository && $2 ~ /^[0-9a-f]{40}$/ { count += 1 }
                    END { print count + 0 }
                  '
              )"
              printf 'runtime_sha_images repository=%s count=%s\n' "$repository" "$sha_image_count"
            done
            unset graph_root sha_image_count repository
            for container in \
              schoolorbit-backend-admin \
              schoolorbit-backend-school \
              schoolorbit-clamd \
              schoolorbit-nginx
            do
              if podman container exists "$container"; then
                podman inspect --format \
                  'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}} aliases={{json $network.Aliases}};{{end}}' \
                  "$container"
              else
                printf 'container=%s status=missing\n' "$container"
              fi
            done
            podman port schoolorbit-nginx || true
            podman inspect --format \
              'nginx_restarts={{.RestartCount}} ports={{json .HostConfig.PortBindings}}' \
              schoolorbit-nginx || true
            podman exec schoolorbit-nginx nginx -t || true
            podman run --rm \
              --network schoolorbit-web \
              -v /opt/stack/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /opt/stack/nginx/ssl:/etc/nginx/ssl:ro \
              docker.io/library/nginx:stable-alpine nginx -t || true
            database_url=""
            if [ -r /opt/stack/.env ]; then
              database_url="$(sed -n 's/^DATABASE_URL=//p' /opt/stack/.env | tail -n 1)"
            fi
            if [ -n "$database_url" ]; then
              podman run --rm docker.io/library/postgres:17-alpine \
                psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 \
                -c "SELECT pid, state, coalesce(wait_event_type, '-'), coalesce(wait_event, '-'), coalesce(extract(epoch from now() - xact_start)::bigint, 0) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid() ORDER BY pid;" || true
            else
              printf '%s\n' 'database_activity=status_unavailable reason=database_url_missing'
            fi
            unset database_url
            for endpoint in \
              http://127.0.0.1:8080/live \
              http://127.0.0.1:8080/ready \
              http://127.0.0.1:8081/ready \
              http://127.0.0.1:80/
            do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$endpoint" || true)"
              printf 'endpoint=%s status=%s\n' "$endpoint" "$status"
            done
