name: Runtime Diagnostics
on:
  workflow_call:
    inputs: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the exact Admin alias metadata
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --get \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "hostname=admin.${BASE_DOMAIN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            | jq '{success,domains:[.result[]|{id,hostname,service,environment}]}'
      - name: Inspect runtime state
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            podman --version
            podman-compose version
            if podman container exists schoolorbit-clamd; then
              podman inspect --format 'clamd_pids_limit={{.HostConfig.PidsLimit}}' schoolorbit-clamd
              podman inspect --format 'clamd_port_bindings={{json .HostConfig.PortBindings}}' schoolorbit-clamd
              podman port schoolorbit-clamd
              if [ -x /opt/stack/deployment/scripts/clamd_runtime_matches.sh ]; then
                /opt/stack/deployment/scripts/clamd_runtime_matches.sh \
                  docker.io/clamav/clamav-debian:1.5.3 schoolorbit-clamd || true
              fi
            fi
            graph_root="$(podman info --format '{{.Store.GraphRoot}}' 2>/dev/null || true)"
            if [ -n "$graph_root" ]; then
              df -P "$graph_root" || true
            else
              printf '%s\n' 'runtime_storage=status_unavailable reason=graph_root_missing'
            fi
            podman system df || true
            podman system df -v || true
            for repository in \
              ghcr.io/akephisit/schoolorbit-backend-admin \
              ghcr.io/akephisit/schoolorbit-backend-school
            do
              sha_image_count="$(
                podman images --format '{{.Repository}}|{{.Tag}}' "$repository" |
                  awk -F '|' -v repository="$repository" '
                    $1 == repository && length($2) == 40 && $2 !~ /[^0-9a-f]/ { count += 1 }
                    END { print count + 0 }
                  '
              )"
              printf 'runtime_sha_images repository=%s count=%s\n' "$repository" "$sha_image_count"
            done
            unset graph_root sha_image_count repository
            for container in \
              schoolorbit-backend-admin \
              schoolorbit-backend-school \
              schoolorbit-clamd \
              schoolorbit-nginx
            do
              if podman container exists "$container"; then
                podman inspect --format \
                  'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}} aliases={{json $network.Aliases}};{{end}}' \
                  "$container"
              else
                printf 'container=%s status=missing\n' "$container"
              fi
            done
            podman port schoolorbit-nginx || true
            podman inspect --format \
              'nginx_restarts={{.RestartCount}} ports={{json .HostConfig.PortBindings}}' \
              schoolorbit-nginx || true
            podman exec schoolorbit-nginx nginx -t || true
            podman run --rm \
              --network schoolorbit-web \
              -v /opt/stack/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /opt/stack/nginx/ssl:/etc/nginx/ssl:ro \
              docker.io/library/nginx:stable-alpine nginx -t || true
            . /opt/stack/deployment/scripts/lib/pipeline-remote/runtime-env.sh
            PGDATABASE=""
            if [ -r /opt/stack/.env ]; then
              PGDATABASE="$(schoolorbit_runtime_env_value DATABASE_URL /opt/stack/.env)"
            fi
            if [ -n "$PGDATABASE" ]; then
              export PGDATABASE
              podman run --rm -e PGDATABASE \
                -v /opt/stack/postgresql/ca.crt:/run/secrets/postgresql-ca.crt:ro \
                public.ecr.aws/docker/library/postgres:18.6-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66 \
                psql -X -A -t -v ON_ERROR_STOP=1 \
                -c "SELECT pid, state, coalesce(wait_event_type, '-'), coalesce(wait_event, '-'), coalesce(extract(epoch from now() - xact_start)::bigint, 0) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid() ORDER BY pid;" || true
            else
              printf '%s\n' 'database_activity=status_unavailable reason=database_url_missing'
            fi
            unset PGDATABASE
            for endpoint in \
              http://127.0.0.1:8080/health \
              http://127.0.0.1:8080/ready \
              http://127.0.0.1:8081/ready \
              http://127.0.0.1:80/
            do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$endpoint" || true)"
              printf 'endpoint=%s status=%s\n' "$endpoint" "$status"
            done
