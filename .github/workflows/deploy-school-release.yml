name: Deploy School Release
run-name: Deploy School Release (${{ inputs.deployment_id || github.sha }})

on:
  push:
    branches: ["main"]
    paths:
      - "backend-school/**"
      - "frontend-school/**"
      - "podman-compose.yml"
      - "nginx-configs/school-api.conf.template"
      - "nginx-configs/school-api.maintenance.conf.template"
      - "scripts/discover_school_tenants.sh"
      - "scripts/find_worker_release_candidates.mjs"
      - "scripts/resolve_school_release_scope.sh"
      - "scripts/resolve_school_release_replay.mjs"
      - "scripts/lib/schoolorbit-installer/configure_pre_cutover_origin.sh"
      - "scripts/render_nginx_config.sh"
      - "scripts/smoke_test.sh"
      - "scripts/prune_runtime_images.sh"
      - "scripts/clamd_runtime_matches.sh"
      - "scripts/reconcile_r2_cors.sh"
      - "scripts/lib/schoolorbit-installer/remote/deployment_timing.sh"
      - ".github/workflows/deploy-school-release.yml"
  workflow_dispatch:
    inputs:
      release_scope:
        description: "School release scope"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - frontend
          - backend
          - full
      deployment_id:
        description: "Installer run identifier"
        required: false
        type: string
      target_origin_ip:
        description: "Temporary origin IPv4 for deployment before DNS cutover"
        required: false
        type: string
      academic_core_smoke_subdomain:
        description: "Tenant subdomain for the authenticated release smoke"
        required: false
        default: "sandbox"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akephisit/schoolorbit-backend-school

concurrency:
  group: school-production-release
  cancel-in-progress: false

jobs:
  resolve-scope:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      needs_frontend: ${{ steps.scope.outputs.needs_frontend }}
      needs_backend: ${{ steps.scope.outputs.needs_backend }}
      release_id: ${{ steps.scope.outputs.release_id }}
      frontend_baseline: ${{ steps.release-state.outputs.frontend_sha }}
      backend_baseline: ${{ steps.release-state.outputs.backend_sha }}
      state_run_id: ${{ steps.accepted-state.outputs.run_id }}
      already_deployed: ${{ steps.replay.outputs.already_deployed }}
      accepted_attempt: ${{ steps.replay.outputs.accepted_attempt }}
      accepted_frontend: ${{ steps.replay.outputs.accepted_frontend }}
      accepted_backend: ${{ steps.replay.outputs.accepted_backend }}
      restore_state: ${{ steps.replay.outputs.restore_state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Detect a previously accepted run attempt
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run="$RUNNER_TEMP/school-release-current-run.json"
          job_pages="$RUNNER_TEMP/school-release-job-pages.json"
          run_pages="$RUNNER_TEMP/school-release-run-pages.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >"$current_run"
          workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0)' "$current_run")"
          created_at="$(jq -er '.created_at | select(type == "string")' "$current_run")"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" |
            jq -s '.' >"$job_pages"
          gh api --paginate --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs" \
            -f branch=main -F per_page=100 -f "created=>=${created_at}" |
            jq -s '.' >"$run_pages"
          node scripts/resolve_school_release_replay.mjs \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            "$current_run" "$job_pages" "$run_pages" >>"$GITHUB_OUTPUT"

      - name: Locate latest trusted accepted release state
        id: accepted-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-school-release.yml"
          )"
          workflow_id="$(jq -er '.id' <<<"$workflow_json")"
          if ! printf '%s' "$workflow_id" | grep -Eq '^[0-9]+$'; then
            echo "Coordinated release workflow ID is invalid"
            exit 1
          fi

          artifacts_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=school-release-state&per_page=100"
          )"
          selected_run_id=''
          selected_created_at=''
          selected_head_sha=''
          mapfile -t candidates < <(
            jq -r '
              [.artifacts[] | select(.expired == false)] |
                sort_by(.created_at) | reverse[] |
                [.workflow_run.id, .created_at] | @tsv
            ' <<<"$artifacts_json"
          )
          for candidate in "${candidates[@]}"; do
            candidate_run_id=${candidate%%$'\t'*}
            candidate_created_at=${candidate#*$'\t'}
            if ! printf '%s' "$candidate_run_id" | grep -Eq '^[0-9]+$'; then
              continue
            fi
            if ! source_run_json="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}" 2>/dev/null
            )"; then
              continue
            fi
            if jq -e \
              --argjson workflow_id "$workflow_id" \
              --arg repo "$GITHUB_REPOSITORY" '
                .workflow_id == $workflow_id and
                (.path | test("^\\.github/workflows/deploy-school-release\\.yml(?:@(?:refs/heads/)?main)?$")) and
                (.event == "push" or .event == "workflow_dispatch") and
                .head_branch == "main" and
                .head_repository.full_name == $repo and
                .repository.full_name == $repo and
                (.head_sha | test("^[0-9a-f]{40}$"))
              ' <<<"$source_run_json" >/dev/null
            then
              selected_run_id=$candidate_run_id
              selected_created_at=$candidate_created_at
              selected_head_sha="$(jq -r '.head_sha' <<<"$source_run_json")"
              break
            fi
          done
          printf 'workflow_id=%s\nrun_id=%s\ncreated_at=%s\nhead_sha=%s\n' \
            "$workflow_id" "$selected_run_id" "$selected_created_at" "$selected_head_sha" \
            >>"$GITHUB_OUTPUT"

      - name: Download accepted release state
        if: steps.accepted-state.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: school-release-state
          path: ${{ runner.temp }}/accepted-release-state
          github-token: ${{ github.token }}
          run-id: ${{ steps.accepted-state.outputs.run_id }}

      - name: Validate accepted state and later attempts
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ steps.accepted-state.outputs.run_id }}
          STATE_CREATED_AT: ${{ steps.accepted-state.outputs.created_at }}
          STATE_HEAD_SHA: ${{ steps.accepted-state.outputs.head_sha }}
          WORKFLOW_ID: ${{ steps.accepted-state.outputs.workflow_id }}
        run: |
          set -euo pipefail
          frontend_sha=''
          backend_sha=''
          force_full=true
          if [ -n "$STATE_RUN_ID" ]; then
            state="$RUNNER_TEMP/accepted-release-state/school-release-state.json"
            jq -e \
              --arg run_id "$STATE_RUN_ID" \
              --arg head_sha "$STATE_HEAD_SHA" '
                .schemaVersion == 1 and
                .workflowRunId == $run_id and
                .releaseId == $head_sha and
                (.scope == "frontend" or .scope == "backend" or .scope == "full") and
                ((.frontendAcceptedSha | type) == "string") and
                (.frontendAcceptedSha | test("^$|^[0-9a-f]{40}$")) and
                ((.backendAcceptedSha | type) == "string") and
                (.backendAcceptedSha | test("^$|^[0-9a-f]{40}$"))
              ' "$state" >/dev/null || {
                echo "Accepted release state is invalid"
                exit 1
              }
            frontend_sha="$(jq -r '.frontendAcceptedSha' "$state")"
            backend_sha="$(jq -r '.backendAcceptedSha' "$state")"
            runs_json="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100"
            )"
            if jq -e \
              --arg accepted_at "$STATE_CREATED_AT" \
              --argjson state_run_id "$STATE_RUN_ID" \
              --argjson current_run_id "$GITHUB_RUN_ID" '
                any(.workflow_runs[];
                  .id != $state_run_id and
                  .id != $current_run_id and
                  .updated_at > $accepted_at)
              ' <<<"$runs_json" >/dev/null
            then
              force_full=true
            else
              force_full=false
            fi
          fi
          printf 'frontend_sha=%s\nbackend_sha=%s\nforce_full=%s\n' \
            "$frontend_sha" "$backend_sha" "$force_full" >>"$GITHUB_OUTPUT"

      - name: Resolve and validate release scope
        id: scope
        env:
          REQUESTED_SCOPE: ${{ inputs.release_scope || 'auto' }}
          FRONTEND_ACCEPTED_SHA: ${{ steps.release-state.outputs.frontend_sha }}
          BACKEND_ACCEPTED_SHA: ${{ steps.release-state.outputs.backend_sha }}
          FORCE_FULL: ${{ steps.release-state.outputs.force_full }}
          ALREADY_DEPLOYED: ${{ steps.replay.outputs.already_deployed }}
          REPLAY_SCOPE: ${{ steps.replay.outputs.accepted_scope }}
          RUNTIME_DEPLOY_ENABLED: ${{ vars.RUNTIME_DEPLOY_ENABLED }}
          FRONTEND_DEPLOY_ENABLED: ${{ vars.FRONTEND_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$ALREADY_DEPLOYED" = true ]; then
            resolution="$(printf 'scope=%s\nneeds_frontend=false\nneeds_backend=false\nrelease_id=%s\n' \
              "$REPLAY_SCOPE" "$GITHUB_SHA")"
          else
            resolution="$(
              bash scripts/resolve_school_release_scope.sh \
                "$REQUESTED_SCOPE" "$GITHUB_SHA" \
                "$FRONTEND_ACCEPTED_SHA" "$BACKEND_ACCEPTED_SHA" "$FORCE_FULL"
            )"
          fi
          scope="$(sed -n 's/^scope=//p' <<<"$resolution")"
          needs_frontend="$(sed -n 's/^needs_frontend=//p' <<<"$resolution")"
          needs_backend="$(sed -n 's/^needs_backend=//p' <<<"$resolution")"
          release_id="$(sed -n 's/^release_id=//p' <<<"$resolution")"
          if [[ ! $scope =~ ^(frontend|backend|full)$ ]] ||
            [[ ! $needs_frontend =~ ^(true|false)$ ]] ||
            [[ ! $needs_backend =~ ^(true|false)$ ]] ||
            ! printf '%s' "$release_id" | grep -Eq '^[0-9a-f]{40}$'
          then
            echo "Release scope resolver returned an invalid result"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$needs_frontend" = true ] && [ "$FRONTEND_DEPLOY_ENABLED" != true ]; then
              echo "FRONTEND_DEPLOY_ENABLED must be true for this push release"
              exit 1
            fi
            if [ "$needs_backend" = true ] && [ "$RUNTIME_DEPLOY_ENABLED" != true ]; then
              echo "RUNTIME_DEPLOY_ENABLED must be true for this push release"
              exit 1
            fi
          fi

          printf 'scope=%s\nneeds_frontend=%s\nneeds_backend=%s\nrelease_id=%s\n' \
            "$scope" "$needs_frontend" "$needs_backend" "$release_id" >>"$GITHUB_OUTPUT"

  build-backend:
    needs: resolve-scope
    if: needs.resolve-scope.outputs.needs_backend == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.backend-image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long

      # Re-enable Buildx with robust config
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Check immutable backend image
        id: existing-backend-image
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          inspect_error="$RUNNER_TEMP/backend-image-inspect-error"
          if docker buildx imagetools inspect "$image" >/dev/null 2>"$inspect_error"; then
            echo 'exists=true' >>"$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|ghcr\.io/[^[:space:]]+: not found|unexpected status from (HEAD|GET) request.*404 Not Found' \
            "$inspect_error"
          then
            echo 'exists=false' >>"$GITHUB_OUTPUT"
          else
            echo "Could not determine whether the immutable backend image exists"
            sed -n '1,20p' "$inspect_error" >&2
            exit 1
          fi

      - name: Build and push Docker image
        if: steps.existing-backend-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend-school
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-school
          cache-to: type=gha,scope=backend-school,mode=max

      - name: Export Cargo timing report
        if: steps.existing-backend-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend-school
          target: build-timings
          push: false
          outputs: type=local,dest=${{ runner.temp }}/cargo-timings-backend-school
          cache-from: type=gha,scope=backend-school

      - name: Upload Cargo timing report
        if: steps.existing-backend-image.outputs.exists != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cargo-timings-backend-school
          path: ${{ runner.temp }}/cargo-timings-backend-school/cargo-timing.html
          retention-days: 7
          if-no-files-found: error

      - name: Resolve immutable backend image digest
        id: backend-image
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          inspection="$(docker buildx imagetools inspect "$image")"
          digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<<"$inspection" | head -n 1)"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Immutable backend image digest is missing or invalid"
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Summarize Docker cache scope
        if: always()
        run: |
          printf '%s\n' \
            '### Docker build cache' \
            '- Scope: backend-school' \
            '- Layer hits: inspect the Docker build record attached to this job.' \
            >> "$GITHUB_STEP_SUMMARY"

  discover-schools:
    needs: resolve-scope
    if: needs.resolve-scope.outputs.needs_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      schools: ${{ steps.fetch-schools.outputs.schools }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure pre-cutover origin routing
        id: origin-routing
        if: inputs.target_origin_ip != ''
        env:
          TARGET_ORIGIN_IP: ${{ inputs.target_origin_ip }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          bash scripts/lib/schoolorbit-installer/configure_pre_cutover_origin.sh \
            "$TARGET_ORIGIN_IP" \
            "$BASE_DOMAIN" \
            "$RUNNER_TEMP/cloudflare-origin-rsa-root.pem"

      - name: Fetch active school list
        id: fetch-schools
        env:
          BACKEND_ADMIN_URL: ${{ vars.BACKEND_ADMIN_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          CURL_CA_BUNDLE: ${{ steps.origin-routing.outputs.origin_ca_root }}
        run: bash scripts/discover_school_tenants.sh

      - name: Require at least one active school
        env:
          SCHOOLS: ${{ steps.fetch-schools.outputs.schools }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "array" and length > 0' <<<"$SCHOOLS" >/dev/null; then
            echo "No active schools are available for the frontend release"
            exit 1
          fi

  stage-frontends:
    needs: [resolve-scope, discover-schools]
    if: >-
      ${{ always() && needs.resolve-scope.outputs.needs_frontend == 'true' &&
          needs.discover-schools.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      matrix:
        school: ${{ fromJson(needs.discover-schools.outputs.schools) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-school/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Create tenant Wrangler configuration
        working-directory: frontend-school
        env:
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${BASE_DOMAIN:?BASE_DOMAIN repository variable is required}"
          : "${BACKEND_SCHOOL_URL:?BACKEND_SCHOOL_URL repository variable is required}"
          if ! printf '%s' "$SUBDOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "School subdomain is invalid"
            exit 1
          fi
          jq -n \
            --arg name "schoolorbit-school-${SUBDOMAIN}" \
            --arg route "${SUBDOMAIN}.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            --arg backend "$BACKEND_SCHOOL_URL" \
            --arg vapid "$VAPID_PUBLIC_KEY" \
            --arg subdomain "$SUBDOMAIN" \
            '{name:$name,main:"build/index.js",compatibility_date:"2025-09-15",compatibility_flags:["nodejs_compat"],assets:{directory:"build/client",binding:"ASSETS"},routes:[{pattern:$route,zone_name:$zone}],vars:{PUBLIC_BACKEND_URL:$backend,PUBLIC_VAPID_KEY:$vapid,SUBDOMAIN:$subdomain}}' \
            >wrangler.json

      - name: Find reusable Worker recovery manifest
        id: reusable-worker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: |
          set -euo pipefail
          artifact_name="school-worker-${SUBDOMAIN}-${RELEASE_ID}"
          artifacts_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"
          )"
          workflow_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-school-release.yml" \
              --jq '.id'
          )"
          if ! printf '%s' "$workflow_id" | grep -Eq '^[0-9]+$'; then
            echo "Coordinated release workflow ID is invalid"
            exit 1
          fi
          run_id=''
          mapfile -t candidate_runs < <(
            jq -r '
              [.artifacts[] | select(.expired == false)] |
                sort_by(.created_at) | reverse[] | .workflow_run.id
            ' <<<"$artifacts_json"
          )
          for candidate_run_id in "${candidate_runs[@]}"; do
            if ! printf '%s' "$candidate_run_id" | grep -Eq '^[0-9]+$'; then
              continue
            fi
            if ! source_run_json="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}" 2>/dev/null
            )"; then
              continue
            fi
            if jq -e \
              --argjson workflow_id "$workflow_id" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg release "$RELEASE_ID" '
                .workflow_id == $workflow_id and
                (.path | test("^\\.github/workflows/deploy-school-release\\.yml(?:@(?:refs/heads/)?main)?$")) and
                (.event == "push" or .event == "workflow_dispatch") and
                .head_branch == "main" and
                .head_sha == $release and
                .head_repository.full_name == $repo and
                .repository.full_name == $repo
              ' <<<"$source_run_json" >/dev/null
            then
              run_id=$candidate_run_id
              break
            fi
          done
          printf 'run_id=%s\n' "$run_id" >>"$GITHUB_OUTPUT"

      - name: Download reusable Worker recovery manifest
        if: steps.reusable-worker.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: school-worker-${{ matrix.school.subdomain }}-${{ needs.resolve-scope.outputs.release_id }}
          path: ${{ runner.temp }}/reusable-worker
          github-token: ${{ github.token }}
          run-id: ${{ steps.reusable-worker.outputs.run_id }}

      - name: Validate reusable Worker recovery manifest
        id: validate-reusable-worker
        if: steps.reusable-worker.outputs.run_id != ''
        working-directory: frontend-school
        env:
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/reusable-worker/worker-release-${SUBDOMAIN}.json"
          candidate_id="$(
            jq -er --arg release "$RELEASE_ID" --arg subdomain "$SUBDOMAIN" '
              if .releaseId == $release and .subdomain == $subdomain and
                (.candidateVersionId | type == "string") and
                (.candidateVersionId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
                ((.previousVersions | type) == "array") and
                ((.previousVersions | length) > 0) and
                all(.previousVersions[];
                  (.id | type == "string") and
                  (.id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
                  (.percentage | type == "number" and . >= 0 and . <= 100))
              then .candidateVersionId
              else error("Worker recovery manifest does not match this release")
              end
            ' "$manifest"
          )"
          npx wrangler versions view "$candidate_id" --json >"$RUNNER_TEMP/worker-version.json"
          jq -e --arg release "$RELEASE_ID" --arg candidate "$candidate_id" '
            .id == $candidate and .annotations["workers/tag"] == $release
          ' "$RUNNER_TEMP/worker-version.json" >/dev/null || {
            echo "Reusable Worker candidate is unavailable or has the wrong release tag"
            exit 1
          }
          cp "$manifest" "$RUNNER_TEMP/worker-release-${SUBDOMAIN}.json"
          echo 'reused=true' >>"$GITHUB_OUTPUT"

      - name: Build tenant frontend
        if: steps.validate-reusable-worker.outputs.reused != 'true'
        working-directory: frontend-school
        env:
          PUBLIC_BACKEND_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          PUBLIC_VAPID_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Recover an inactive candidate missing only its manifest
        id: recover-inactive-worker
        if: steps.reusable-worker.outputs.run_id == ''
        working-directory: frontend-school
        env:
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: |
          set -euo pipefail
          candidate_json="$(
            node ../scripts/find_worker_release_candidates.mjs \
              "schoolorbit-school-${SUBDOMAIN}" "$RELEASE_ID"
          )"
          jq -e '
            type == "array" and
            all(.[];
              type == "string" and
              test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
          ' <<<"$candidate_json" >/dev/null || {
            echo "Complete Worker version inventory returned an invalid candidate set"
            exit 1
          }
          mapfile -t candidates < <(
            jq -r '.[]' <<<"$candidate_json"
          )
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo 'reused=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#candidates[@]}" -ne 1 ] ||
            ! printf '%s' "${candidates[0]}" |
              grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          then
            echo "Worker release has ambiguous candidate versions and cannot be recovered safely"
            exit 1
          fi
          candidate_id=${candidates[0]}
          npx wrangler versions view "$candidate_id" --json >"$RUNNER_TEMP/recovered-worker-version.json"
          jq -e --arg release "$RELEASE_ID" --arg candidate "$candidate_id" '
            .id == $candidate and .annotations["workers/tag"] == $release
          ' "$RUNNER_TEMP/recovered-worker-version.json" >/dev/null || {
            echo "Recovered Worker candidate is unavailable or has the wrong release tag"
            exit 1
          }
          npx wrangler deployments list --json >"$RUNNER_TEMP/current-deployments.json"
          if jq -e --arg candidate "$candidate_id" '
            any(.[].versions[]; (.version_id // .id) == $candidate)
          ' "$RUNNER_TEMP/current-deployments.json" >/dev/null; then
            echo "Worker candidate is already active but its original rollback manifest is unavailable"
            exit 1
          fi
          jq -ce '
            if type != "array" or length == 0 then error("missing active Worker deployment")
            else (sort_by(.created_on // .created_at // "") | last | .versions)
            end
            | if type == "array" and length > 0 then
                map({id: (.version_id // .id), percentage})
              else error("active Worker deployment has no versions")
              end
          ' "$RUNNER_TEMP/current-deployments.json" >"$RUNNER_TEMP/previous-versions.json"
          jq -nce \
            --arg releaseId "$RELEASE_ID" \
            --arg subdomain "$SUBDOMAIN" \
            --arg candidateVersionId "$candidate_id" \
            --slurpfile previousVersions "$RUNNER_TEMP/previous-versions.json" \
            '{releaseId:$releaseId,subdomain:$subdomain,candidateVersionId:$candidateVersionId,previousVersions:$previousVersions[0]}' \
            >"$RUNNER_TEMP/worker-release-${SUBDOMAIN}.json"
          echo 'reused=true' >>"$GITHUB_OUTPUT"

      - name: Record current Worker deployment
        if: >-
          ${{ steps.validate-reusable-worker.outputs.reused != 'true' &&
              steps.recover-inactive-worker.outputs.reused != 'true' }}
        working-directory: frontend-school
        run: |
          set -euo pipefail
          npx wrangler deployments list --json >"$RUNNER_TEMP/current-deployments.json"
          jq -ce '
            if type != "array" or length == 0 then error("missing active Worker deployment")
            else (sort_by(.created_on // .created_at // "") | last | .versions)
            end
            | if type == "array" and length > 0 then
                map({id: (.version_id // .id), percentage})
              else error("active Worker deployment has no versions")
              end
          ' "$RUNNER_TEMP/current-deployments.json" >"$RUNNER_TEMP/previous-versions.json"

      - name: Upload inactive Worker version
        if: >-
          ${{ steps.validate-reusable-worker.outputs.reused != 'true' &&
              steps.recover-inactive-worker.outputs.reused != 'true' }}
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-school
          command: versions upload --tag "${{ needs.resolve-scope.outputs.release_id }}" --message "SchoolOrbit release ${{ needs.resolve-scope.outputs.release_id }}"

      - name: Record staged Worker manifest
        if: >-
          ${{ steps.validate-reusable-worker.outputs.reused != 'true' &&
              steps.recover-inactive-worker.outputs.reused != 'true' }}
        working-directory: frontend-school
        env:
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: |
          set -euo pipefail
          npx wrangler versions list --json >"$RUNNER_TEMP/worker-versions.json"
          candidate_id="$(jq -er --arg release "$RELEASE_ID" '
            [.[] | select(.annotations["workers/tag"] == $release)]
            | sort_by(.number // 0) | last | .id
          ' "$RUNNER_TEMP/worker-versions.json")"
          jq -nce \
            --arg releaseId "$RELEASE_ID" \
            --arg subdomain "$SUBDOMAIN" \
            --arg candidateVersionId "$candidate_id" \
            --slurpfile previousVersions "$RUNNER_TEMP/previous-versions.json" \
            '{releaseId:$releaseId,subdomain:$subdomain,candidateVersionId:$candidateVersionId,previousVersions:$previousVersions[0]}' \
            >"$RUNNER_TEMP/worker-release-${SUBDOMAIN}.json"

      - name: Upload Worker recovery manifest
        if: steps.reusable-worker.outputs.run_id != github.run_id
        uses: actions/upload-artifact@v6
        with:
          name: school-worker-${{ matrix.school.subdomain }}-${{ needs.resolve-scope.outputs.release_id }}
          path: ${{ runner.temp }}/worker-release-${{ matrix.school.subdomain }}.json
          retention-days: 14
          if-no-files-found: error

  deploy-backend:
    needs: [resolve-scope, build-backend, stage-frontends]
    if: >-
      ${{ always() && needs.resolve-scope.outputs.needs_backend == 'true' &&
          needs.build-backend.result == 'success' &&
          (needs.resolve-scope.outputs.needs_frontend != 'true' ||
           needs.stage-frontends.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-schoolorbit-runtime
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Academic Core authenticated smoke inputs
        env:
          ACADEMIC_CORE_SMOKE_SUBDOMAIN: ${{ inputs.academic_core_smoke_subdomain || 'sandbox' }}
        run: |
          if ! printf '%s' "$ACADEMIC_CORE_SMOKE_SUBDOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "academic_core_smoke_subdomain must be one canonical DNS label"
            exit 1
          fi

      - name: Upload canonical runtime and proxy templates
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: podman-compose.yml,scripts/render_nginx_config.sh,scripts/smoke_test.sh,scripts/prune_runtime_images.sh,scripts/clamd_runtime_matches.sh,scripts/reconcile_r2_cors.sh,scripts/lib/schoolorbit-installer/remote/install_origin_root.sh,scripts/lib/schoolorbit-installer/remote/ensure_container_network.sh,scripts/lib/schoolorbit-installer/remote/deployment_timing.sh,nginx-configs/admin-api.conf.template,nginx-configs/school-api.conf.template,nginx-configs/school-api.maintenance.conf.template
          target: /opt/stack/deployment

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/stack

            base_domain="${{ vars.BASE_DOMAIN || 'schoolorbit.app' }}"
            deployment_root=/opt/stack/deployment
            runtime_source="$deployment_root/podman-compose.yml"
            runtime_compose=/opt/stack/podman-compose.yml
            runtime_env=/opt/stack/.env
            renderer_source="$deployment_root/scripts/render_nginx_config.sh"
            renderer="$deployment_root/render-nginx"
            origin_root_installer_source="$deployment_root/scripts/lib/schoolorbit-installer/remote/install_origin_root.sh"
            origin_root_installer="$deployment_root/install-origin-root"
            network_helper_source="$deployment_root/scripts/lib/schoolorbit-installer/remote/ensure_container_network.sh"
            timing_helper_source="$deployment_root/scripts/lib/schoolorbit-installer/remote/deployment_timing.sh"
            image_cleanup="$deployment_root/scripts/prune_runtime_images.sh"
            clamd_matcher="$deployment_root/scripts/clamd_runtime_matches.sh"
            r2_cors_helper_source="$deployment_root/scripts/reconcile_r2_cors.sh"
            proxy_template="$deployment_root/nginx-configs/school-api.conf.template"
            maintenance_proxy_template="$deployment_root/nginx-configs/school-api.maintenance.conf.template"
            proxy_source="$deployment_root/school-api.conf"
            maintenance_proxy_source="$deployment_root/school-api.maintenance.conf"
            proxy_target=/opt/stack/nginx/conf.d/school-api.conf
            legacy_proxy_target=/opt/stack/nginx/conf.d/school-api.${base_domain}.conf
            origin_root=/opt/stack/nginx/ssl/cloudflare-origin-rsa-root.pem
            backend_image=ghcr.io/akephisit/schoolorbit-backend-school
            backend_image_digest="${{ needs.build-backend.outputs.image_digest }}"
            if ! printf '%s' "$backend_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Backend image digest is invalid"
              exit 1
            fi
            backend_school_image_reference="${backend_image}@${backend_image_digest}"
            test -f "$runtime_source" || { echo "Canonical runtime definition is missing"; exit 1; }
            test -f "$runtime_env" || { echo "Backend runtime environment is missing"; exit 1; }
            test -f "$renderer_source" || { echo "Proxy renderer is missing"; exit 1; }
            test -f "$origin_root_installer_source" || { echo "Origin CA root installer is missing"; exit 1; }
            test -f "$network_helper_source" || { echo "Container network helper is missing"; exit 1; }
            test -f "$timing_helper_source" || { echo "Deployment timing helper is missing"; exit 1; }
            test -f "$image_cleanup" || { echo "Runtime image cleanup is missing"; exit 1; }
            test -x "$clamd_matcher" || { echo "ClamAV runtime matcher is missing"; exit 1; }
            test -f "$proxy_template" || { echo "School API proxy template is missing"; exit 1; }
            test -f "$maintenance_proxy_template" || { echo "School API maintenance template is missing"; exit 1; }

            . "$timing_helper_source"

            runtime_env_value() {
              local key=$1 line value decoded char
              local -i index=0
              case "$key" in
                JWT_SECRET | SESSION_HMAC_KEY | SCHOOL_ROLLBACK_JWT_SECRET | \
                  BASE_DOMAIN | TRUSTED_PROXY_CIDRS | SCHOOL_ALLOWED_DEV_ORIGINS | \
                  R2_ACCOUNT_ID | R2_ACCESS_KEY_ID | R2_SECRET_ACCESS_KEY | \
                  R2_PUBLIC_BUCKET_NAME | R2_PRIVATE_BUCKET_NAME) ;;
                *) return 64 ;;
              esac
              line="$(grep -m 1 "^${key}=" "$runtime_env")" || return
              value=${line#*=}
              if [[ ${#value} -lt 2 || ${value:0:1} != "'" || ${value: -1} != "'" ]]; then
                echo "Runtime environment value is not installer encoded: ${key}" >&2
                return 65
              fi
              value=${value:1:${#value}-2}
              decoded=
              while ((index < ${#value})); do
                char=${value:index:1}
                if [[ $char == \\ ]]; then
                  ((index += 1))
                  if ((index >= ${#value})); then
                    echo "Runtime environment value has invalid escaping: ${key}" >&2
                    return 65
                  fi
                  char=${value:index:1}
                  if [[ $char != \\ && $char != "'" ]]; then
                    echo "Runtime environment value has invalid escaping: ${key}" >&2
                    return 65
                  fi
                fi
                decoded+=$char
                ((index += 1))
              done
              printf '%s' "$decoded"
            }
            export_school_compose_env() {
              export BACKEND_SCHOOL_IMAGE_REFERENCE="$backend_school_image_reference"
              export SESSION_HMAC_KEY="$session_hmac_key"
              export SCHOOL_ROLLBACK_JWT_SECRET="$school_rollback_jwt_secret"
              export BASE_DOMAIN="$runtime_base_domain"
              export TRUSTED_PROXY_CIDRS="$trusted_proxy_cidrs"
              export SCHOOL_ALLOWED_DEV_ORIGINS="$school_allowed_dev_origins"
            }
            unset_school_compose_env() {
              unset BACKEND_SCHOOL_IMAGE_REFERENCE SESSION_HMAC_KEY
              unset SCHOOL_ROLLBACK_JWT_SECRET BASE_DOMAIN
              unset TRUSTED_PROXY_CIDRS SCHOOL_ALLOWED_DEV_ORIGINS
            }
            if ! session_hmac_key="$(runtime_env_value SESSION_HMAC_KEY)"; then
              echo "Required backend-school runtime value is unavailable: SESSION_HMAC_KEY"
              exit 1
            fi

            if ! school_rollback_jwt_secret="$(runtime_env_value SCHOOL_ROLLBACK_JWT_SECRET)"; then
              echo "Required backend-school runtime value is unavailable: SCHOOL_ROLLBACK_JWT_SECRET"
              exit 1
            fi
            if ! admin_jwt_secret="$(runtime_env_value JWT_SECRET)"; then
              echo "Required backend-admin runtime value is unavailable: JWT_SECRET"
              exit 1
            fi
            if [ "${#session_hmac_key}" -lt 32 ]; then
              echo "Backend-school runtime value is too short: SESSION_HMAC_KEY"
              exit 1
            fi
            if [ "${#school_rollback_jwt_secret}" -lt 32 ]; then
              echo "Backend-school runtime value is too short: SCHOOL_ROLLBACK_JWT_SECRET"
              exit 1
            fi
            if [ "$session_hmac_key" = "$school_rollback_jwt_secret" ] ||
              [ "$session_hmac_key" = "$admin_jwt_secret" ] ||
              [ "$school_rollback_jwt_secret" = "$admin_jwt_secret" ]
            then
              echo "School session secrets must be distinct from each other and admin JWT_SECRET"
              exit 1
            fi
            if ! runtime_base_domain="$(runtime_env_value BASE_DOMAIN)"; then
              echo "Required backend-school runtime value is unavailable: BASE_DOMAIN"
              exit 1
            fi
            if [ "$runtime_base_domain" != "$base_domain" ]; then
              echo "Backend-school runtime BASE_DOMAIN does not match the deployment domain"
              exit 1
            fi
            if ! trusted_proxy_cidrs="$(runtime_env_value TRUSTED_PROXY_CIDRS)" ||
              [ -z "$trusted_proxy_cidrs" ]
            then
              echo "Required backend-school runtime value is unavailable: TRUSTED_PROXY_CIDRS"
              exit 1
            fi
            if ! school_allowed_dev_origins="$(runtime_env_value SCHOOL_ALLOWED_DEV_ORIGINS)"; then
              echo "Required backend-school runtime value is unavailable: SCHOOL_ALLOWED_DEV_ORIGINS"
              exit 1
            fi
            unset admin_jwt_secret

            install -m 0755 "$renderer_source" "$renderer"
            install -m 0755 "$origin_root_installer_source" "$origin_root_installer"
            "$origin_root_installer" "$origin_root"
            export_school_compose_env
            cp "$runtime_source" "${runtime_compose}.next"
            podman-compose -f "${runtime_compose}.next" --dry-run up -d backend-school >/dev/null 2>&1
            unset_school_compose_env
            mv "${runtime_compose}.next" "$runtime_compose"
            "$renderer" "$proxy_template" "$proxy_source" "$base_domain" "${{ github.sha }}" ready
            "$renderer" "$maintenance_proxy_template" "$maintenance_proxy_source" "$base_domain" "${{ github.sha }}" maintenance

            proxy_matches="$(grep -lF "server_name school-api.${base_domain};" /opt/stack/nginx/conf.d/*.conf 2>/dev/null || true)"
            proxy_match_count="$(printf '%s\n' "$proxy_matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$proxy_match_count" -gt 1 ]; then
              echo "Expected at most one active school API proxy config, found ${proxy_match_count}"
              exit 1
            fi
            if [ "$proxy_match_count" -eq 1 ] &&
              [ "$proxy_matches" != "$proxy_target" ] &&
              [ "$proxy_matches" != "$legacy_proxy_target" ]
            then
              echo "School API proxy exists at an unexpected path: ${proxy_matches}"
              exit 1
            fi
            proxy_previous_target="$proxy_target"
            if [ "$proxy_match_count" -eq 1 ]; then
              proxy_previous_target="$proxy_matches"
            fi
            public_bucket="$(runtime_env_value R2_PUBLIC_BUCKET_NAME)"
            private_bucket="$(runtime_env_value R2_PRIVATE_BUCKET_NAME)"
            if [ "$public_bucket" = "$private_bucket" ]; then
              echo "Public and private File Platform buckets must be different"
              exit 1
            fi

            r2_started="$(schoolorbit_timer_now)"
            export AWS_ACCESS_KEY_ID="$(runtime_env_value R2_ACCESS_KEY_ID)"
            export AWS_SECRET_ACCESS_KEY="$(runtime_env_value R2_SECRET_ACCESS_KEY)"
            export AWS_DEFAULT_REGION=auto
            export AWS_EC2_METADATA_DISABLED=true
            r2_account_id="$(runtime_env_value R2_ACCOUNT_ID)"
            r2_endpoint="https://${r2_account_id}.r2.cloudflarestorage.com"
            r2_cli() {
              podman run --rm \
                -e AWS_ACCESS_KEY_ID \
                -e AWS_SECRET_ACCESS_KEY \
                -e AWS_DEFAULT_REGION \
                -e AWS_EC2_METADATA_DISABLED \
                docker.io/amazon/aws-cli:2.36.9 \
                --endpoint-url "$r2_endpoint" \
                "$@"
            }
            podman pull docker.io/amazon/aws-cli:2.36.9
            if ! r2_cli s3api head-bucket --bucket "$public_bucket" >/dev/null 2>&1; then
              echo "Configured public File Platform bucket is not accessible"
              exit 1
            fi
            if ! r2_cli s3api head-bucket --bucket "$private_bucket" >/dev/null 2>&1; then
              if ! r2_cli s3api create-bucket --bucket "$private_bucket" >/dev/null; then
                echo "Private File Platform bucket is absent and could not be created"
                exit 1
              fi
            fi
            r2_cli s3api head-bucket --bucket "$private_bucket" >/dev/null

            private_cors_origin="https://*.${base_domain}"
            private_cors_policy="$(
              jq -cn --arg origin "$private_cors_origin" \
                '{CORSRules:[{AllowedOrigins:[$origin],AllowedMethods:["GET","HEAD"],AllowedHeaders:["Range"],ExposeHeaders:["Accept-Ranges","Content-Length","Content-Range","Content-Type","ETag"],MaxAgeSeconds:3600}]}'
            )"
            . "$r2_cors_helper_source"
            schoolorbit_reconcile_r2_cors "$private_bucket" "$private_cors_policy"
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            schoolorbit_timer_report r2_reconciliation "$r2_started"

            . "$network_helper_source"
            compose_up_quiet() {
              if [ "$#" -eq 1 ] && [ "$1" = clamd ]; then
                # podman-compose <1.4 ignores the service's pids_limit.
                # Restrict this compatibility flag to the scanner only.
                podman-compose --podman-run-args='--pids-limit=256' \
                  -f "$runtime_compose" up -d --no-deps clamd >/dev/null 2>&1
              else
                podman-compose -f "$runtime_compose" up -d "$@" >/dev/null 2>&1
              fi
            }
            reconnect_backend_network() {
              container=$1
              service_alias=$2
              schoolorbit_ensure_container_network_aliases \
                schoolorbit-web "$container" "$service_alias" "$container" schoolorbit-nginx
            }
            recreate_nginx() {
              podman stop schoolorbit-nginx >/dev/null 2>&1 || true
              podman rm schoolorbit-nginx >/dev/null 2>&1 || true
              compose_up_quiet nginx
            }
            validate_nginx_config_with_retry() {
              nginx_test_output=""
              for nginx_test_attempt in $(seq 1 30); do
                if nginx_test_output="$(podman exec schoolorbit-nginx nginx -t 2>&1)"; then
                  printf '%s\n' "$nginx_test_output"
                  return 0
                fi
                if [ "$nginx_test_attempt" -lt 30 ]; then
                  sleep 2
                fi
              done
              printf '%s\n' "$nginx_test_output" >&2
              return 1
            }
            podman-compose -f "$runtime_compose" --dry-run up -d clamd backend-school >/dev/null 2>&1

            # The scanner gets an isolated container network and no published port.
            scanner_started="$(schoolorbit_timer_now)"
            clamd_image=docker.io/clamav/clamav-debian:1.5.3
            podman pull "$clamd_image"
            if clamd_match_output="$("$clamd_matcher" "$clamd_image" schoolorbit-clamd)"; then
              if [ "$clamd_match_output" != "clamd_action=reused" ]; then
                echo "ClamAV runtime matcher returned an invalid result"
                exit 1
              fi
              printf '%s\n' "$clamd_match_output"
            else
              case "$clamd_match_output" in
                'clamd_drift reason=missing_container') clamd_reason=missing_container ;;
                'clamd_drift reason=container_inspect') clamd_reason=container_inspect ;;
                'clamd_drift reason=image_inspect') clamd_reason=image_inspect ;;
                'clamd_drift reason=image') clamd_reason=image ;;
                'clamd_drift reason=memory') clamd_reason=memory ;;
                'clamd_drift reason=cpu') clamd_reason=cpu ;;
                'clamd_drift reason=pids') clamd_reason=pids ;;
                'clamd_drift reason=restart') clamd_reason=restart ;;
                'clamd_drift reason=security') clamd_reason=security ;;
                'clamd_drift reason=published_port') clamd_reason=published_port ;;
                'clamd_drift reason=signature_volume') clamd_reason=signature_volume ;;
                'clamd_drift reason=network') clamd_reason=network ;;
                'clamd_drift reason=running') clamd_reason=running ;;
                'clamd_drift reason=health') clamd_reason=health ;;
                *) clamd_reason=matcher_failure ;;
              esac
              printf 'clamd_action=recreated reason=%s\n' "$clamd_reason"
              if podman container exists schoolorbit-clamd; then
                podman stop schoolorbit-clamd
                podman rm schoolorbit-clamd
              fi
              compose_up_quiet clamd
            fi

            expected_clamd_memory_bytes=$((3 * 1024 * 1024 * 1024))
            clamd_pids_limit="$(podman inspect --format '{{.HostConfig.PidsLimit}}' schoolorbit-clamd)"
            if [ "$clamd_pids_limit" != 256 ]; then
              echo "Clamd PID limit mismatch after creation; refusing to continue"
              exit 1
            fi
            clamd_memory_bytes="$(podman inspect --format '{{.HostConfig.Memory}}' schoolorbit-clamd)"
            if [ "$clamd_memory_bytes" != "$expected_clamd_memory_bytes" ]; then
              echo "Clamd memory limit mismatch: expected ${expected_clamd_memory_bytes} bytes, got ${clamd_memory_bytes} bytes"
              exit 1
            fi
            scanner_ready=false
            for attempt in $(seq 1 60); do
              scanner_status="$(podman inspect --format '{{.State.Health.Status}}' schoolorbit-clamd 2>/dev/null || true)"
              if [ "$scanner_status" = "healthy" ]; then
                scanner_ready=true
                break
              fi
              if [ "$attempt" -lt 60 ]; then
                sleep 10
              fi
            done
            if [ "$scanner_ready" != "true" ]; then
              podman logs --tail 100 schoolorbit-clamd
              exit 1
            fi
            schoolorbit_timer_report scanner_readiness "$scanner_started"

            jq_image=ghcr.io/jqlang/jq:1.7.1
            podman pull "$jq_image"
            image_pull_started="$(schoolorbit_timer_now)"
            podman pull "$backend_school_image_reference"
            schoolorbit_timer_report image_pull "$image_pull_started"

            # Keep the shared admin upstream resolvable before Nginx is recreated.
            reconnect_backend_network schoolorbit-backend-admin backend-admin

            proxy_backup=""
            proxy_existed=0
            if [ -f "$proxy_previous_target" ]; then
              proxy_backup="$(mktemp /opt/stack/nginx/conf.d/.school-api.backup.XXXXXX)"
              cp "$proxy_previous_target" "$proxy_backup"
              proxy_existed=1
            fi
            restore_pre_maintenance_proxy() {
              rm -f "$proxy_target"
              if [ "$proxy_existed" -eq 1 ]; then
                cp "$proxy_backup" "$proxy_previous_target"
              fi
              recreate_nginx
              validate_nginx_config_with_retry
              podman exec schoolorbit-nginx nginx -s reload
            }
            if [ "$proxy_previous_target" != "$proxy_target" ]; then
              rm -f "$proxy_previous_target"
            fi
            echo "Activate School API maintenance for release ${{ github.sha }}"
            cp "$maintenance_proxy_source" "$proxy_target"
            if ! recreate_nginx ||
              ! validate_nginx_config_with_retry ||
              ! podman exec schoolorbit-nginx nginx -s reload
            then
              restore_pre_maintenance_proxy
              [ -z "$proxy_backup" ] || rm -f "$proxy_backup"
              echo "School API could not enter validated maintenance mode"
              exit 1
            fi

            backend_readiness_started="$(schoolorbit_timer_now)"

            # Recreate backend-school only; do not restart unrelated services.
            if podman container exists schoolorbit-backend-school; then
              podman rm --force schoolorbit-backend-school
              if podman container exists schoolorbit-backend-school; then
                echo "Stale backend-school container remains after forced removal"
                exit 1
              fi
            fi
            export_school_compose_env
            compose_up_quiet --no-deps backend-school
            unset_school_compose_env
            unset session_hmac_key school_rollback_jwt_secret
            unset runtime_base_domain trusted_proxy_cidrs school_allowed_dev_origins
            reconnect_backend_network schoolorbit-backend-school backend-school

            # /ready checks control plane, both R2 buckets, and clamd.
            if ! timeout 180 bash -c '
              for attempt in $(seq 1 36); do
                if curl -fsS "$1" >/dev/null; then
                  exit 0
                fi
                if [ "$attempt" -lt 36 ]; then
                  sleep 5
                fi
              done
              exit 1
            ' _ http://127.0.0.1:8081/ready; then
              podman logs --tail 100 schoolorbit-backend-school
              echo "Cutover image is not ready; maintenance remains enabled and pre-cutover rollback is disabled"
              exit 1
            fi
            schoolorbit_timer_report backend_readiness "$backend_readiness_started"

            migration_response="$(mktemp /opt/stack/.backend-school-migration.XXXXXX)"
            chmod 600 "$migration_response"
            cleanup_migration_response() {
              rm -f "$migration_response"
            }
            print_migration_verification_failure() {
              podman run --rm -i "$jq_image" -r '
                "tenant_migration_summary latest_version=\(.latest_version // "unknown") total=\(.total // "unknown") success=\(.success // "unknown") failed=\(.failed // "unknown")",
                (
                  .results[]?
                  | "tenant_migration_result subdomain=\(.subdomain // "unknown") status=\(.status // "unknown") version=\(.version // "none") error_code=\(
                      if .error == null then "none"
                      else (([.error | scan("ACADEMIC_[A-Z0-9_]+") ] | first) // "redacted")
                      end
                    )"
                ),
                (
                  .results[]? as $result
                  | $result.academicDiagnostics.currentTeacherConflicts[]?
                  | "tenant_academic_teacher_conflict subdomain=\($result.subdomain // "unknown") teacher_id=\(.teacherId // "unknown") timetable_version_id=\(.timetableVersionId // "unknown") day=\(.dayOfWeek // "unknown") bell_schedule_period_id=\(.bellSchedulePeriodId // "unknown") entry_count=\(.entryCount // "unknown") group_code_count=\(.groupCodeCount // "unknown") entry_ids=\((.entryIds // []) | tojson) group_codes=\((.groupCodes // []) | tojson)"
                )
              '
            }
            trap cleanup_migration_response EXIT

            internal_api_secret="$(
              podman inspect schoolorbit-backend-school \
                --format '{{range .Config.Env}}{{println .}}{{end}}' |
                sed -n 's/^INTERNAL_API_SECRET=//p' |
                tail -n 1
            )"
            if [ -z "$internal_api_secret" ]; then
              echo "Backend internal migration credential is unavailable; maintenance remains enabled"
              exit 1
            fi
            tenant_migration_started="$(schoolorbit_timer_now)"
            if ! curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 900 \
              -X POST \
              -H "X-Internal-Secret: ${internal_api_secret}" \
              -o "$migration_response" \
              http://127.0.0.1:8081/internal/migrate-all
            then
              echo "Tenant migration request failed; maintenance remains enabled"
              exit 1
            fi
            if ! podman run --rm -i "$jq_image" -e '
                .latest_version as $latest
                | $latest >= 32
                and .total > 0
                and .failed == 0
                and .success == .total
                and all(
                  .results[];
                  .version == $latest
                  and .error == null
                  and (.status == "migrated" or .status == "already_migrated")
                )
              ' < "$migration_response" >/dev/null
            then
              print_migration_verification_failure < "$migration_response" ||
                echo "Tenant migration diagnostic could not be rendered"
              echo "Tenant migration verification failed; maintenance remains enabled"
              exit 1
            fi
            schoolorbit_timer_report tenant_migration "$tenant_migration_started"

            migration_status_started="$(schoolorbit_timer_now)"
            if ! curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              -H "X-Internal-Secret: ${internal_api_secret}" \
              -o "$migration_response" \
              http://127.0.0.1:8081/internal/migration-status
            then
              echo "Tenant migration status request failed; maintenance remains enabled"
              exit 1
            fi
            if ! podman run --rm -i "$jq_image" -e '
                .latest_version as $latest
                | $latest >= 45
                and .total_schools > 0
                and .migrated == .total_schools
                and .pending == 0 and .failed == 0 and .outdated == 0
                and all(
                  .schools[];
                  .migration_version == $latest
                  and .migration_status == "migrated"
                  and .migration_error == null
                  and .academicCoreCutover.migrationVersion == 45
                  and .academicCoreCutover.status == "cleanupCompleted"
                  and .academicCoreCutover.passed == true
                  and all(.academicCoreCutover.checks[]; .passed == true)
                  and .gradebookResultsCutover.migrationVersion == 60
                  and .gradebookResultsCutover.status == "cutoverCompleted"
                  and .gradebookResultsCutover.passed == true
                  and all(.gradebookResultsCutover.checks[]; .passed == true)
                )
              ' < "$migration_response" >/dev/null
            then
              echo "Tenant migration or cutover audit verification failed; maintenance remains enabled"
              exit 1
            fi
            schoolorbit_timer_report migration_status "$migration_status_started"
            unset internal_api_secret
            rm -f "$migration_response"
            trap - EXIT

            [ -z "$proxy_backup" ] || rm -f "$proxy_backup"
            echo "School API remains in maintenance until the authenticated smoke completes"

      - name: Run Academic Core authenticated smoke
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACADEMIC_CORE_SMOKE_SUBDOMAIN: ${{ inputs.academic_core_smoke_subdomain || 'sandbox' }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: ACADEMIC_CORE_SMOKE_SUBDOMAIN,SMOKE_USERNAME,SMOKE_PASSWORD
          script: |
            set -eu
            smoke_subdomain=${ACADEMIC_CORE_SMOKE_SUBDOMAIN:-}
            case "$smoke_subdomain" in
              '' | *[!a-z0-9-]* | -* | *-)
                echo "Academic Core smoke subdomain is invalid"
                exit 1
                ;;
            esac
            if [ "${#smoke_subdomain}" -gt 63 ]; then
              echo "Academic Core smoke subdomain is invalid"
              exit 1
            fi
            if [ -z "${SMOKE_USERNAME:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ]; then
              echo "Academic Core maintenance smoke credentials are unavailable"
              exit 1
            fi

            base_domain="${{ vars.BASE_DOMAIN || 'schoolorbit.app' }}"
            smoke_script=/opt/stack/deployment/scripts/smoke_test.sh
            timing_helper_source=/opt/stack/deployment/scripts/lib/schoolorbit-installer/remote/deployment_timing.sh
            test -f "$smoke_script" || {
              echo "Academic Core maintenance smoke script is unavailable"
              exit 1
            }
            test -f "$timing_helper_source" || {
              echo "Deployment timing helper is unavailable"
              exit 1
            }
            . "$timing_helper_source"

            authenticated_smoke_started="$(schoolorbit_timer_now)"
            SMOKE_SUBDOMAIN="$smoke_subdomain" \
            SMOKE_API_URL=http://localhost:8081 \
            SMOKE_ADMIN_API_URL="https://admin-api.${base_domain}" \
            SMOKE_TENANT_URL="https://${smoke_subdomain}.${base_domain}" \
            SMOKE_ORIGIN="https://${smoke_subdomain}.${base_domain}" \
            SMOKE_REQUIRE_AUTH=true \
            SMOKE_ACADEMIC_CONTEXT=true \
            SMOKE_DIRECT_BACKEND=true \
            SMOKE_USERNAME="$SMOKE_USERNAME" \
            SMOKE_PASSWORD="$SMOKE_PASSWORD" \
            bash "$smoke_script"
            schoolorbit_timer_report authenticated_smoke "$authenticated_smoke_started"
            unset SMOKE_USERNAME SMOKE_PASSWORD

  promote-frontends:
    needs: [resolve-scope, discover-schools, stage-frontends, deploy-backend]
    if: >-
      ${{ always() && needs.resolve-scope.outputs.needs_frontend == 'true' &&
          needs.discover-schools.result == 'success' &&
          needs.stage-frontends.result == 'success' &&
          (needs.resolve-scope.outputs.needs_backend != 'true' ||
           needs.deploy-backend.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      matrix:
        school: ${{ fromJson(needs.discover-schools.outputs.schools) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-school/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Create tenant Wrangler configuration
        working-directory: frontend-school
        env:
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${BASE_DOMAIN:?BASE_DOMAIN repository variable is required}"
          : "${BACKEND_SCHOOL_URL:?BACKEND_SCHOOL_URL repository variable is required}"
          jq -n \
            --arg name "schoolorbit-school-${SUBDOMAIN}" \
            --arg route "${SUBDOMAIN}.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            --arg backend "$BACKEND_SCHOOL_URL" \
            --arg vapid "$VAPID_PUBLIC_KEY" \
            --arg subdomain "$SUBDOMAIN" \
            '{name:$name,main:"build/index.js",compatibility_date:"2025-09-15",compatibility_flags:["nodejs_compat"],assets:{directory:"build/client",binding:"ASSETS"},routes:[{pattern:$route,zone_name:$zone}],vars:{PUBLIC_BACKEND_URL:$backend,PUBLIC_VAPID_KEY:$vapid,SUBDOMAIN:$subdomain}}' \
            >wrangler.json
          jq -n \
            --arg name "schoolorbit-school-${SUBDOMAIN}" \
            --arg route "${SUBDOMAIN}.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            '{name:$name,routes:[{pattern:$route,zone_name:$zone}]}' \
            >wrangler-triggers.json

      - name: Download staged Worker manifest
        uses: actions/download-artifact@v7
        with:
          name: school-worker-${{ matrix.school.subdomain }}-${{ needs.resolve-scope.outputs.release_id }}
          path: ${{ runner.temp }}/staged-worker

      - name: Validate staged Worker manifest
        id: staged-worker
        working-directory: frontend-school
        env:
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/staged-worker/worker-release-${SUBDOMAIN}.json"
          candidate_id="$(
            jq -er --arg release "$RELEASE_ID" --arg subdomain "$SUBDOMAIN" '
              if .releaseId == $release and .subdomain == $subdomain and
                (.candidateVersionId | type == "string") and
                (.candidateVersionId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
              then .candidateVersionId
              else error("Staged Worker manifest does not match this release")
              end
            ' "$manifest"
          )"
          npx wrangler versions view "$candidate_id" --json >"$RUNNER_TEMP/staged-worker-version.json"
          jq -e --arg release "$RELEASE_ID" --arg candidate "$candidate_id" '
            .id == $candidate and .annotations["workers/tag"] == $release
          ' "$RUNNER_TEMP/staged-worker-version.json" >/dev/null || {
            echo "Staged Worker candidate is unavailable or has the wrong release tag"
            exit 1
          }
          printf 'version_id=%s\n' "$candidate_id" >>"$GITHUB_OUTPUT"

      - name: Synchronize menu routes through VPS loopback
        working-directory: frontend-school
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/school-release-ssh"
          key_file="$ssh_directory/key"
          known_hosts="$ssh_directory/known_hosts"
          install -d -m 0700 "$ssh_directory"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$key_file"
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_IP" >"$known_hosts" 2>/dev/null
          ssh -i "$key_file" -p "$SERVER_PORT" \
            -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -N -L 127.0.0.1:18081:127.0.0.1:8081 \
            "${SERVER_USER}@${SERVER_IP}" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true; rm -f "$key_file"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:18081/health >/dev/null 2>&1
            then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Backend loopback tunnel did not become ready"
              exit 1
            fi
            sleep 1
          done
          PUBLIC_BACKEND_URL=http://127.0.0.1:18081 npm run sync:menu-routes

      - name: Promote staged Worker version
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-school
          command: versions deploy --version-id "${{ steps.staged-worker.outputs.version_id }}" --percentage 100 -y --message "Accepted SchoolOrbit release ${{ needs.resolve-scope.outputs.release_id }}"

      - name: Apply tenant Worker routes
        working-directory: frontend-school
        run: npx wrangler triggers deploy --config wrangler-triggers.json

      - name: Verify promoted tenant Worker
        working-directory: frontend-school
        env:
          CANDIDATE_VERSION_ID: ${{ steps.staged-worker.outputs.version_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            npx wrangler deployments list --json >"$RUNNER_TEMP/promoted-deployments.json"
            if jq -e --arg candidate "$CANDIDATE_VERSION_ID" '
              sort_by(.created_on // .created_at // "") | last | .versions |
              length == 1 and
              ((.[0].version_id // .[0].id) == $candidate) and
              (.[0].percentage == 100)
            ' "$RUNNER_TEMP/promoted-deployments.json" >/dev/null
            then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Promoted tenant Worker did not activate the recorded candidate"
              exit 1
            fi
            sleep 5
          done

      - name: Install Chromium for application mount check
        working-directory: frontend-school
        run: npx playwright install --with-deps chromium

      - name: Verify promoted frontend readiness
        working-directory: frontend-school
        env:
          TENANT_ORIGIN: https://${{ matrix.school.subdomain }}.${{ vars.BASE_DOMAIN }}
        run: node scripts/verify-tenant-worker-readiness.mjs

  accept-release:
    needs: [resolve-scope, build-backend, stage-frontends, deploy-backend, promote-frontends]
    if: >-
      ${{ always() && needs.resolve-scope.result == 'success' &&
          (needs.resolve-scope.outputs.needs_frontend != 'true' ||
           needs.promote-frontends.result == 'success') &&
          (needs.resolve-scope.outputs.needs_backend != 'true' ||
           needs.deploy-backend.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Open accepted School API release
        if: needs.resolve-scope.outputs.needs_backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACADEMIC_CORE_SMOKE_SUBDOMAIN: ${{ inputs.academic_core_smoke_subdomain || 'sandbox' }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: ACADEMIC_CORE_SMOKE_SUBDOMAIN,SMOKE_USERNAME,SMOKE_PASSWORD
          script: |
            set -eu
            base_domain="${{ vars.BASE_DOMAIN || 'schoolorbit.app' }}"
            smoke_subdomain=${ACADEMIC_CORE_SMOKE_SUBDOMAIN:-sandbox}
            proxy_source=/opt/stack/deployment/school-api.conf
            maintenance_proxy_source=/opt/stack/deployment/school-api.maintenance.conf
            proxy_target=/opt/stack/nginx/conf.d/school-api.conf
            origin_root=/opt/stack/nginx/ssl/cloudflare-origin-rsa-root.pem
            smoke_script=/opt/stack/deployment/scripts/smoke_test.sh
            timing_helper_source=/opt/stack/deployment/scripts/lib/schoolorbit-installer/remote/deployment_timing.sh
            image_cleanup=/opt/stack/deployment/scripts/prune_runtime_images.sh
            test -f "$proxy_source"
            test -f "$maintenance_proxy_source"
            test -f "$origin_root"
            test -f "$smoke_script"
            test -f "$timing_helper_source"
            test -x "$image_cleanup"
            . "$timing_helper_source"
            proxy_cutover_started="$(schoolorbit_timer_now)"

            restore_maintenance() {
              cp "$maintenance_proxy_source" "$proxy_target"
              podman exec schoolorbit-nginx nginx -t
              podman exec schoolorbit-nginx nginx -s reload || true
            }

            cp "$proxy_source" "$proxy_target"
            if ! podman exec schoolorbit-nginx nginx -t; then
              restore_maintenance
              echo "Normal school API proxy configuration is invalid; maintenance remains enabled"
              exit 1
            fi
            if ! podman exec schoolorbit-nginx nginx -s reload; then
              restore_maintenance
              echo "Normal school API proxy reload failed; maintenance remains enabled"
              exit 1
            fi

            school_host="school-api.${base_domain}"
            direct_ready_ok=false
            for attempt in $(seq 1 12); do
              if direct_ready="$(
                curl --fail --silent --show-error --max-time 15 \
                  --cacert "$origin_root" \
                  --resolve "${school_host}:443:127.0.0.1" \
                  "https://${school_host}/ready"
              )" && printf '%s' "$direct_ready" | jq -e \
                '.status == "ready" and .controlPlane == "connected" and .filePlatform == "ready"' >/dev/null
              then
                direct_ready_ok=true
                break
              fi
              [ "$attempt" -eq 12 ] || sleep 2
            done
            if [ "$direct_ready_ok" != true ]; then
              restore_maintenance
              echo "Direct school API readiness failed; maintenance restored"
              exit 1
            fi

            if ! SMOKE_SUBDOMAIN="$smoke_subdomain" \
              SMOKE_API_URL="https://${school_host}" \
              SMOKE_ADMIN_API_URL="https://admin-api.${base_domain}" \
              SMOKE_TENANT_URL="https://${smoke_subdomain}.${base_domain}" \
              SMOKE_ORIGIN="https://${smoke_subdomain}.${base_domain}" \
              SMOKE_REQUIRE_AUTH=true \
              SMOKE_ACADEMIC_CONTEXT=true \
              SMOKE_DIRECT_BACKEND=false \
              SMOKE_RESOLVE_IP=127.0.0.1 \
              SMOKE_CA_CERT="$origin_root" \
              SMOKE_USERNAME="$SMOKE_USERNAME" \
              SMOKE_PASSWORD="$SMOKE_PASSWORD" \
              bash "$smoke_script"
            then
              restore_maintenance
              echo "Public release smoke failed; maintenance restored"
              exit 1
            fi

            backend_image=ghcr.io/akephisit/schoolorbit-backend-school
            backend_image_digest="${{ needs.build-backend.outputs.image_digest }}"
            if ! printf '%s' "$backend_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              restore_maintenance
              echo "Accepted backend image digest is invalid; maintenance restored"
              exit 1
            fi
            backend_image_reference="${backend_image}@${backend_image_digest}"
            podman tag "$backend_image_reference" "${backend_image}:${{ needs.resolve-scope.outputs.release_id }}"
            podman tag "${backend_image}:${{ needs.resolve-scope.outputs.release_id }}" "${backend_image}:latest"
            "$image_cleanup" "$backend_image" 3
            schoolorbit_timer_report proxy_cutover "$proxy_cutover_started"
            unset SMOKE_USERNAME SMOKE_PASSWORD
            echo "School API release ${{ needs.resolve-scope.outputs.release_id }} is ready"

      - name: Log in to the Container registry
        if: needs.resolve-scope.outputs.needs_backend == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.resolve-scope.outputs.needs_backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Advance accepted backend image tag
        if: needs.resolve-scope.outputs.needs_backend == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${{ needs.resolve-scope.outputs.release_id }}"

      - name: Create accepted release state
        env:
          RELEASE_SCOPE: ${{ needs.resolve-scope.outputs.scope }}
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          PREVIOUS_FRONTEND_SHA: ${{ needs.resolve-scope.outputs.frontend_baseline }}
          PREVIOUS_BACKEND_SHA: ${{ needs.resolve-scope.outputs.backend_baseline }}
          NEEDS_FRONTEND: ${{ needs.resolve-scope.outputs.needs_frontend }}
          NEEDS_BACKEND: ${{ needs.resolve-scope.outputs.needs_backend }}
          ALREADY_DEPLOYED: ${{ needs.resolve-scope.outputs.already_deployed }}
          REPLAY_FRONTEND: ${{ needs.resolve-scope.outputs.accepted_frontend }}
          REPLAY_BACKEND: ${{ needs.resolve-scope.outputs.accepted_backend }}
        run: |
          set -euo pipefail
          frontend_sha=$PREVIOUS_FRONTEND_SHA
          backend_sha=$PREVIOUS_BACKEND_SHA
          accepted_frontend=$NEEDS_FRONTEND
          accepted_backend=$NEEDS_BACKEND
          if [ "$ALREADY_DEPLOYED" = true ]; then
            accepted_frontend=$REPLAY_FRONTEND
            accepted_backend=$REPLAY_BACKEND
          fi
          if [[ ! $accepted_frontend =~ ^(true|false)$ ]] ||
            [[ ! $accepted_backend =~ ^(true|false)$ ]]
          then
            echo "Accepted component selection is invalid"
            exit 1
          fi
          if [ "$accepted_frontend" = true ]; then
            frontend_sha=$RELEASE_ID
          fi
          if [ "$accepted_backend" = true ]; then
            backend_sha=$RELEASE_ID
          fi
          if ! printf '%s' "$frontend_sha" | grep -Eq '^$|^[0-9a-f]{40}$' ||
            ! printf '%s' "$backend_sha" | grep -Eq '^$|^[0-9a-f]{40}$'
          then
            echo "Accepted component baseline is invalid"
            exit 1
          fi
          jq -nce \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg releaseId "$RELEASE_ID" \
            --arg scope "$RELEASE_SCOPE" \
            --arg frontendAcceptedSha "$frontend_sha" \
            --arg backendAcceptedSha "$backend_sha" \
            '{schemaVersion:1,workflowRunId:$workflowRunId,releaseId:$releaseId,scope:$scope,frontendAcceptedSha:$frontendAcceptedSha,backendAcceptedSha:$backendAcceptedSha}' \
            >"$RUNNER_TEMP/school-release-state.json"

      - name: Persist accepted release state
        if: >-
          ${{ (needs.resolve-scope.outputs.already_deployed != 'true' ||
               needs.resolve-scope.outputs.restore_state == 'true') &&
              needs.resolve-scope.outputs.state_run_id != github.run_id }}
        uses: actions/upload-artifact@v6
        with:
          name: school-release-state
          path: ${{ runner.temp }}/school-release-state.json
          retention-days: 90
          if-no-files-found: error

      - name: Record accepted release
        env:
          RELEASE_SCOPE: ${{ needs.resolve-scope.outputs.scope }}
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          ALREADY_DEPLOYED: ${{ needs.resolve-scope.outputs.already_deployed }}
          ACCEPTED_ATTEMPT: ${{ needs.resolve-scope.outputs.accepted_attempt }}
          RESTORE_STATE: ${{ needs.resolve-scope.outputs.restore_state }}
        run: |
          if [ "$ALREADY_DEPLOYED" = true ]; then
            printf 'School release %s was already accepted in run attempt %s; deployment was not repeated' \
              "$RELEASE_ID" "$ACCEPTED_ATTEMPT" >>"$GITHUB_STEP_SUMMARY"
            if [ "$RESTORE_STATE" = true ]; then
              echo ', and its accepted state was restored.' >>"$GITHUB_STEP_SUMMARY"
            else
              echo '; a newer workflow run exists, so accepted state was left unchanged.' \
                >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            printf 'School release accepted: scope=%s release=%s\n' "$RELEASE_SCOPE" "$RELEASE_ID" \
              >>"$GITHUB_STEP_SUMMARY"
          fi

  release-summary:
    needs: [resolve-scope, stage-frontends, deploy-backend, promote-frontends, accept-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report bounded release outcome
        env:
          RELEASE_ID: ${{ needs.resolve-scope.outputs.release_id }}
          RELEASE_SCOPE: ${{ needs.resolve-scope.outputs.scope }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
          FRONTEND_RESULT: ${{ needs.promote-frontends.result }}
          ACCEPT_RESULT: ${{ needs.accept-release.result }}
          ALREADY_DEPLOYED: ${{ needs.resolve-scope.outputs.already_deployed }}
          ACCEPTED_ATTEMPT: ${{ needs.resolve-scope.outputs.accepted_attempt }}
          RESTORE_STATE: ${{ needs.resolve-scope.outputs.restore_state }}
        run: |
          set -euo pipefail
          printf 'scope=%s release=%s backend=%s frontend=%s accepted=%s\n' \
            "$RELEASE_SCOPE" "$RELEASE_ID" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$ACCEPT_RESULT" \
            >>"$GITHUB_STEP_SUMMARY"
          if [ "$ALREADY_DEPLOYED" = true ]; then
            printf 'Release already accepted in run attempt %s; build and deployment jobs were skipped' \
              "$ACCEPTED_ATTEMPT" >>"$GITHUB_STEP_SUMMARY"
            if [ "$RESTORE_STATE" = true ]; then
              echo ', and the current accepted state was restored.' >>"$GITHUB_STEP_SUMMARY"
            else
              echo '; newer workflow history was not changed.' >>"$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$ACCEPT_RESULT" != success ] && [ "$BACKEND_RESULT" != skipped ]; then
            echo "School API remains in maintenance for the failed release" >>"$GITHUB_STEP_SUMMARY"
          fi
