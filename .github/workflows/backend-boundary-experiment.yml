name: Backend Boundary Experiment

on:
  push:
    branches: [perf/backend-build-next]
    paths: [.github/workflows/backend-boundary-experiment.yml]

permissions:
  contents: read

jobs:
  compare-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare unchanged baseline context
        run: |
          mkdir -p "$RUNNER_TEMP/boundary-baseline"
          git archive c1134a68 backend-school | tar -x -C "$RUNNER_TEMP/boundary-baseline"
      - uses: docker/setup-buildx-action@v4
      - name: Configure compiler cache transport
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Restore unchanged production builder
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/boundary-baseline/backend-school
          target: builder
          load: true
          tags: schoolorbit-boundary:builder
          cache-from: type=gha,scope=backend-school
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Compare before and after on the same Docker CPU quota
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/boundary-results"
          docker run --rm --cpus=2 \
            -v "$PWD/scripts/benchmark_backend_build.sh:/benchmark.sh:ro" \
            -v "$PWD/backend-school:/candidate:ro" \
            -v "$RUNNER_TEMP/boundary-results:/results" \
            --entrypoint bash schoolorbit-boundary:builder -c '
              set -euo pipefail
              unset RUSTC_WRAPPER
              bash /benchmark.sh backend-school gnu /results/before
              cp -a /candidate/Cargo.toml /candidate/Cargo.lock /app/
              cp -a /candidate/src/. /app/src/
              cp -a /candidate/crates/. /app/crates/
              BENCH_LINKER=gnu BENCH_LINK_LOG=/results/prime-link.txt \
                cargo rustc --release --locked --bin backend-school --timings -- \
                  -C linker=/tmp/schoolorbit-benchmark-linker -C lto=off \
                  2>&1 | tee /results/prime-after.log
              bash /benchmark.sh backend-school gnu /results/after
              python3 -c "import json; from pathlib import Path; p=Path(\"/results\"); assert json.loads((p/\"before/openapi-baseline.json\").read_text()) == json.loads((p/\"after/openapi-baseline.json\").read_text())"
              printf "\n// Boundary service invalidation probe\n" >>crates/school-academic-assessment/src/exam_schedule/services/rounds_and_days.rs
              BENCH_LINKER=gnu BENCH_LINK_LOG=/results/service-link.txt \
                cargo rustc --release --locked --bin backend-school --timings -- \
                  -C linker=/tmp/schoolorbit-benchmark-linker -C lto=off \
                  2>&1 | tee /results/service-change.log
              cp target/cargo-timings/cargo-timing.html /results/service-change.html
            '
          {
            echo '### Same-runner assessment boundary comparison (2 CPU quota)'
            echo '```json'
            cat "$RUNNER_TEMP/boundary-results/before/result.json"
            cat "$RUNNER_TEMP/boundary-results/after/result.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-boundary-comparison
          path: ${{ runner.temp }}/boundary-results
          retention-days: 7
