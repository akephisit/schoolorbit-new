name: Admin backend release implementation
on:
  workflow_call:
    inputs:
      release_bundle_digest:
        type: string
        required: true
      input_hash:
        type: string
        required: true
      target_origin_ip:
        type: string
        default: ""
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # Resolve inside this job: GitHub can redact raw digests passed through
      # outputs of a job that also receives deployment secrets.
      - name: Refuse an active or unresolved owned cleanup
        uses: ./.github/actions/owned-cleanup-interlock
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Download prepared Admin backend manifest
        uses: actions/download-artifact@v7
        with:
          name: prepared-backend-admin
          path: ${{ runner.temp }}/prepared
      - name: Validate Admin backend digest
        id: manifest
        env:
          INPUT_HASH: ${{ inputs.input_hash }}
        run: |
          set -euo pipefail
          digest=$(jq -er --arg sha "$GITHUB_SHA" --arg hash "$INPUT_HASH" '
            if .schemaVersion == 1 and .component == "backend-admin" and .sha == $sha and .inputHash == $hash and (.digest | test("^sha256:[0-9a-f]{64}$")) then .digest else error("Prepared image identity mismatch") end
          ' "$RUNNER_TEMP/prepared/backend-admin.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy selected commit to the target origin
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.target_origin_ip || secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash "/opt/stack/deployment/release-bundles/$RELEASE_SHA/$RELEASE_BUNDLE_SHA256/scripts/lib/pipeline-remote/admin-deploy.sh"
          envs: REGISTRY_TOKEN,REGISTRY_USER,BASE_DOMAIN,RELEASE_SHA,RELEASE_BUNDLE_SHA256,BACKEND_IMAGE_DIGEST,ADMIN_BOOTSTRAP_EMAIL,ADMIN_BOOTSTRAP_PASSWORD
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'schoolorbit.app' }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.release_bundle_digest }}
          BACKEND_IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
