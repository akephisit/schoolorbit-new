name: Permission Contract

on:
  workflow_call:
  pull_request:
    paths:
      - "contracts/permissions*.json"
      - "scripts/generate-permissions.mjs"
      - "scripts/tests/generate-permissions.test.mjs"
      - "backend-school/crates/school-permissions/**"
      - "backend-school/crates/school-migrations/**"
      - "backend-school/Cargo.toml"
      - "backend-school/Cargo.lock"
      - "backend-school/tests/static_architecture.rs"
      - "frontend-school/src/lib/permissions/registry*.ts"
      - "frontend-school/tests/static/**"
      - "frontend-school/package.json"
      - "frontend-school/package-lock.json"
      - ".github/actions/setup-contract-rust/**"
      - ".github/workflows/permission-contract.yml"
      - "backend-school/**"
      - "frontend-school/**"
      - "podman-compose.yml"
      - "nginx-configs/school-api.conf.template"
      - "nginx-configs/school-api.maintenance.conf.template"
      - "scripts/discover_school_tenants.sh"
      - "scripts/find_worker_release_candidates.mjs"
      - "scripts/resolve_school_release_scope.sh"
      - "scripts/resolve_school_release_replay.mjs"
      - "scripts/lib/schoolorbit-installer/configure_pre_cutover_origin.sh"
      - "scripts/render_nginx_config.sh"
      - "scripts/smoke_test.sh"
      - "scripts/prune_runtime_images.sh"
      - "scripts/clamd_runtime_matches.sh"
      - "scripts/reconcile_r2_cors.sh"
      - "scripts/lib/schoolorbit-installer/remote/deployment_timing.sh"
      - ".github/actions/setup-chromium/**"
      - ".github/workflows/deploy-school-release.yml"
      - "scripts/verify_school_release_ci.mjs"
      - "scripts/tests/school-release-ci.test.mjs"
  push:
    branches:
      - main
    paths:
      - "contracts/permissions*.json"
      - "scripts/generate-permissions.mjs"
      - "scripts/tests/generate-permissions.test.mjs"
      - "backend-school/crates/school-permissions/**"
      - "backend-school/crates/school-migrations/**"
      - "backend-school/Cargo.toml"
      - "backend-school/Cargo.lock"
      - "backend-school/tests/static_architecture.rs"
      - "frontend-school/src/lib/permissions/registry*.ts"
      - "frontend-school/tests/static/**"
      - "frontend-school/package.json"
      - "frontend-school/package-lock.json"
      - ".github/actions/setup-contract-rust/**"
      - ".github/workflows/permission-contract.yml"
      - "backend-school/**"
      - "frontend-school/**"
      - "podman-compose.yml"
      - "nginx-configs/school-api.conf.template"
      - "nginx-configs/school-api.maintenance.conf.template"
      - "scripts/discover_school_tenants.sh"
      - "scripts/find_worker_release_candidates.mjs"
      - "scripts/resolve_school_release_scope.sh"
      - "scripts/resolve_school_release_replay.mjs"
      - "scripts/lib/schoolorbit-installer/configure_pre_cutover_origin.sh"
      - "scripts/render_nginx_config.sh"
      - "scripts/smoke_test.sh"
      - "scripts/prune_runtime_images.sh"
      - "scripts/clamd_runtime_matches.sh"
      - "scripts/reconcile_r2_cors.sh"
      - "scripts/lib/schoolorbit-installer/remote/deployment_timing.sh"
      - ".github/actions/setup-chromium/**"
      - ".github/workflows/deploy-school-release.yml"
      - "scripts/verify_school_release_ci.mjs"
      - "scripts/tests/school-release-ci.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLIC_BACKEND_URL: http://localhost:3000
      PUBLIC_VAPID_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-school/package-lock.json

      - name: Setup Rust
        uses: ./.github/actions/setup-contract-rust

      - name: Restore Rust dependency cache
        id: rust_cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: backend-school-contracts
          workspaces: backend-school -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        if: always()
        env:
          RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
        run: |
          printf '%s\n' \
            '### Rust build cache' \
            '- Shared key: backend-school-contracts' \
            "- Exact cache hit: ${RUST_CACHE_HIT:-false}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated permission artifacts
        run: node scripts/generate-permissions.mjs --check

      - name: Test permission generator
        run: node --test scripts/tests/generate-permissions.test.mjs

      - name: Check backend formatting
        working-directory: backend-school
        run: cargo fmt --all -- --check

      - name: Check backend
        working-directory: backend-school
        run: cargo check --workspace --all-targets

      - name: Test backend architecture
        working-directory: backend-school
        run: cargo test --test static_architecture

      - name: Install frontend dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Install Podman Compose
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose

      - name: Test frontend static contracts
        working-directory: frontend-school
        run: npm run test:static

      - name: Check frontend
        working-directory: frontend-school
        run: npm run check
