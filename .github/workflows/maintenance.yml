name: Maintenance
on:
  schedule:
    - cron: 23 19 * * 6
    - cron: 47 19 * * *
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        type: choice
        default: retention
        options:
          - retention
          - api-tls
      dry_run:
        description: List old backend releases without deleting them
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: schoolorbit-production
  cancel-in-progress: false
jobs:
  api-tls:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 19 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'api-tls')
    uses: ./.github/workflows/api-tls.yml
    with:
      mode: renew
    secrets: inherit
  retain:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 19 * * 6') || (github.event_name == 'workflow_dispatch' && inputs.task == 'retention')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: schoolorbit-backend-admin
            keep: 30
          - package: schoolorbit-backend-school
            keep: 30
          - package: schoolorbit-backend-school-cache
            keep: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Protect accepted component baselines under the production lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/pipeline-state.mjs > "$RUNNER_TEMP/accepted-state.json"
      - name: Retain bounded backend releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ matrix.package }}
          EXECUTE: ${{ (github.event_name == 'schedule' && (matrix.package == 'schoolorbit-backend-school-cache' || vars.GHCR_RETENTION_ENABLED == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
          KEEP: ${{ matrix.keep }}
        run: |
          arguments=(
            --owner "${{ github.repository_owner }}"
            --package "$PACKAGE_NAME"
            --keep "$KEEP"
          )
          component="${PACKAGE_NAME#schoolorbit-}"
          protected_sha=$(jq -r --arg part "$component" '.components[$part].sha // empty' "$RUNNER_TEMP/accepted-state.json")
          if [ -n "$protected_sha" ]; then arguments+=(--protect "$protected_sha"); fi
          if [ "$EXECUTE" = "true" ]; then
            arguments+=(--execute)
          fi
          node scripts/prune_ghcr_versions.mjs "${arguments[@]}"
