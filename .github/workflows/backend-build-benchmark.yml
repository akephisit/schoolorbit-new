name: Backend Build Benchmark
on:
  workflow_call:
    inputs:
      backend:
        description: Backend to measure
        type: string
        default: both
      samples:
        description: Source-changing samples per compiler profile
        type: string
        default: "2"
      variants:
        description: Comma-separated final-crate profiles, starting with default
        type: string
        default: default,cgu64
      baseline:
        description: Exact School baseline SHA for a paired API-registry-only source comparison
        type: string
        default: ""
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend == 'both' && '["backend-school","backend-admin"]' || format('["{0}"]', inputs.backend)) }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate bounded benchmark selection
        env:
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_SAMPLES: ${{ inputs.samples }}
          BENCH_VARIANTS: ${{ inputs.variants }}
          BENCH_BASELINE: ${{ inputs.baseline }}
        run: |
          case "$BENCH_BACKEND" in backend-school|backend-admin) ;; *) exit 64 ;; esac
          [[ "$BENCH_SAMPLES" =~ ^[2-5]$ ]]
          if [ -n "$BENCH_BASELINE" ]; then
            [[ "$BENCH_BACKEND" = backend-school && "$BENCH_BASELINE" =~ ^[a-f0-9]{40}$ && "$BENCH_VARIANTS" = default,api-batches ]]
          else
            [[ "$BENCH_VARIANTS" =~ ^default(,(opt2|cgu64|cgu256)){0,3}$ ]]
          fi
      - name: Select exact baseline source when comparing API registry construction
        id: source
        env:
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          context="$GITHUB_WORKSPACE/$BENCH_BACKEND"
          if [ -n "$BENCH_BASELINE" ]; then
            git fetch --no-tags origin "$BENCH_BASELINE"
            changed=$(git diff --name-only "$BENCH_BASELINE" HEAD -- backend-school)
            test "$changed" = backend-school/src/api_contract.rs
            context="$RUNNER_TEMP/baseline/backend-school"
            mkdir -p "$context"
            git archive "$BENCH_BASELINE:backend-school" | tar -xf - -C "$context"
          fi
          printf 'context=%s\n' "$context" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Configure compiler cache transport
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Restore exact production builder
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.source.outputs.context }}
          target: builder
          load: true
          tags: schoolorbit-benchmark:builder
          cache-from: type=gha,scope=${{ matrix.backend }}
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Compare on the same runner and persistent Cargo state
        env:
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_SAMPLES: ${{ inputs.samples }}
          BENCH_VARIANTS: ${{ inputs.variants }}
          BENCH_BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-benchmark"
          mounts=()
          if [ "$BENCH_BACKEND" = backend-school ]; then
            mounts+=(-v "$PWD/backend-school/src/api_contract.rs:/candidate-api.rs:ro")
          fi
          docker create --name schoolorbit-benchmark --cpus=2 \
            -e BENCH_SAMPLES \
            "${mounts[@]}" \
            -v "$PWD/scripts/benchmark_backend_build.sh:/benchmark.sh:ro" \
            -v "$PWD/scripts/summarize_backend_benchmark.py:/summarize_backend_benchmark.py:ro" \
            -v "$RUNNER_TEMP/build-benchmark:/benchmark-results" \
            --entrypoint sleep schoolorbit-benchmark:builder infinity
          trap 'docker rm --force schoolorbit-benchmark >/dev/null' EXIT
          docker start schoolorbit-benchmark
          docker exec schoolorbit-benchmark sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null'
          docker cp schoolorbit-benchmark:/app/target/cargo-timings "$RUNNER_TEMP/build-benchmark/builder-evidence"
          {
            printf 'candidate_sha=%s baseline_sha=%s backend=%s cpu_quota=2 cargo_jobs=2 incremental=off\n' "$GITHUB_SHA" "${BENCH_BASELINE:-$GITHUB_SHA}" "$BENCH_BACKEND"
            docker image inspect schoolorbit-benchmark:builder --format '{{.Id}}'
            docker exec schoolorbit-benchmark rustc -vV
            docker exec schoolorbit-benchmark sh -c 'cat /sys/fs/cgroup/cpu.max; cat /sys/fs/cgroup/memory.max; uname -m'
            lscpu
          } > "$RUNNER_TEMP/build-benchmark/environment.txt"
          IFS=',' read -r -a variants <<< "$BENCH_VARIANTS"
          for variant in "${variants[@]}"; do
            docker exec schoolorbit-benchmark bash /benchmark.sh "$BENCH_BACKEND" "$variant" "/benchmark-results/$variant/application"
            if [ "$variant" = default ] && [ "$BENCH_BACKEND" = backend-school ] && [ -z "$BENCH_BASELINE" ]; then
              for owner in academic attendance; do
                docker exec schoolorbit-benchmark bash /benchmark.sh "$BENCH_BACKEND" default "/benchmark-results/default/$owner" "$owner"
              done
            fi
          done
          # Diagnostic compilation only: stable release settings remain unchanged.
          # Bootstrap enables logging/monomorphization statistics on the pinned compiler.
          mkdir -p "$RUNNER_TEMP/build-benchmark/compiler-profile"
          profile_flags=(-Z time-passes -Z dump-mono-stats=/benchmark-results/compiler-profile/mono -Z dump-mono-stats-format=json)
          if [ "$BENCH_BACKEND" = backend-school ]; then profile_flags+=(-C lto=off); fi
          docker exec -e RUSTC_BOOTSTRAP=1 -e CARGO_INCREMENTAL=0 -e CARGO_BUILD_JOBS=2 \
            schoolorbit-benchmark bash -c 'unset RUSTC_WRAPPER; cargo rustc --release --locked --bin "$1" -- "${@:2}"' \
            bash "$BENCH_BACKEND" "${profile_flags[@]}" 2>&1 | tee "$RUNNER_TEMP/build-benchmark/compiler-profile/passes.log"
          if [ "$BENCH_BACKEND" = backend-school ]; then
            docker exec schoolorbit-benchmark env -i PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin HOME=/tmp \
              target/release/backend-school export-openapi > "$RUNNER_TEMP/build-benchmark/compiler-profile/openapi.json"
            python3 - "$RUNNER_TEMP/build-benchmark" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if json.loads((root / 'openapi-baseline.json').read_text()) != json.loads((root / 'compiler-profile/openapi.json').read_text()):
              raise SystemExit('Profiled binary changed the OpenAPI contract')
          PY
          fi
          {
            echo "### $BENCH_BACKEND / $GITHUB_SHA"
            echo 'Source-changing Cargo/link timings on one runner; dependencies already built.'
            echo 'Each timed build links once. Profile/graph priming is reported separately.'
            echo 'Wrapper disabled for Cargo invalidation; builder cache evidence is separate.'
            echo 'Two CPU quota and two Cargo jobs throughout. Results are not deployment or API latency.'
            python3 scripts/render_backend_benchmark_summary.py "$RUNNER_TEMP/build-benchmark"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-build-${{ matrix.backend }}
          path: ${{ runner.temp }}/build-benchmark
          retention-days: 7
          if-no-files-found: error
