name: Backend Build Benchmark

on:
  workflow_dispatch:
  push:
    branches: [perf/backend-build-next]
    paths: [.github/workflows/backend-build-benchmark.yml]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [backend-school, backend-admin]
        variant: [gnu, lld, opt2, cgu64, cpu1]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Configure compiler cache transport
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Restore exact production builder
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.backend }}
          target: builder
          load: true
          tags: schoolorbit-benchmark:builder
          cache-from: type=gha,scope=${{ matrix.backend }}
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Compare source-changing release builds
        env:
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cpus=2
          if [ "$BENCH_VARIANT" = cpu1 ]; then cpus=1; fi
          mkdir -p "$RUNNER_TEMP/build-benchmark"
          docker run --rm --cpus="$cpus" \
            -v "$PWD/scripts/benchmark_backend_build.sh:/benchmark.sh:ro" \
            -v "$RUNNER_TEMP/build-benchmark:/benchmark-results" \
            --entrypoint bash schoolorbit-benchmark:builder \
            /benchmark.sh "$BENCH_BACKEND" "$BENCH_VARIANT" /benchmark-results
          {
            echo "### $BENCH_BACKEND / $BENCH_VARIANT ($cpus CPU quota)"
            echo 'Source-changing Cargo/link timings; dependencies already built. Not deployment or API latency.'
            echo '```json'
            cat "$RUNNER_TEMP/build-benchmark/result.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-build-${{ matrix.backend }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/build-benchmark
          retention-days: 7
