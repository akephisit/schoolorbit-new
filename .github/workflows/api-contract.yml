name: API Contract

on:
  pull_request:
    paths:
      - "contracts/openapi/**"
      - "scripts/generate-api-contracts.mjs"
      - "scripts/tests/generate-api-contracts.test.mjs"
      - "backend-school/Cargo.toml"
      - "backend-school/Cargo.lock"
      - "backend-school/crates/**"
      - "backend-school/migrations/**"
      - "scripts/test_backend_school.sh"
      - "backend-school/src/api_contract.rs"
      - "backend-school/src/api_response.rs"
      - "backend-school/src/main.rs"
      - "backend-school/src/modules/**"
      - "backend-school/tests/static_architecture.rs"
      - "frontend-school/src/lib/api/**"
      - "frontend-school/tests/static/api-response-contract.test.mjs"
      - "frontend-school/package.json"
      - "frontend-school/package-lock.json"
      - ".rules"
      - "docs/TESTING.md"
      - ".github/actions/setup-contract-rust/**"
      - ".github/workflows/api-contract.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/openapi/**"
      - "scripts/generate-api-contracts.mjs"
      - "scripts/tests/generate-api-contracts.test.mjs"
      - "backend-school/Cargo.toml"
      - "backend-school/Cargo.lock"
      - "backend-school/crates/**"
      - "backend-school/migrations/**"
      - "scripts/test_backend_school.sh"
      - "backend-school/src/api_contract.rs"
      - "backend-school/src/api_response.rs"
      - "backend-school/src/main.rs"
      - "backend-school/src/modules/**"
      - "backend-school/tests/static_architecture.rs"
      - "frontend-school/src/lib/api/**"
      - "frontend-school/tests/static/api-response-contract.test.mjs"
      - "frontend-school/package.json"
      - "frontend-school/package-lock.json"
      - ".rules"
      - "docs/TESTING.md"
      - ".github/actions/setup-contract-rust/**"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read

jobs:
  artifacts:
    name: Contract artifacts and offline export
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLIC_BACKEND_URL: http://localhost:3000
      PUBLIC_VAPID_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-school/package-lock.json

      - name: Setup Rust
        uses: ./.github/actions/setup-contract-rust

      - name: Restore Rust dependency cache
        id: rust_cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: backend-school-contracts
          workspaces: backend-school -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        if: always()
        env:
          RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
        run: |
          printf '%s\n' \
            '### Rust build cache' \
            '- Shared key: backend-school-contracts' \
            "- Exact cache hit: ${RUST_CACHE_HIT:-false}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Test API contract generator
        working-directory: frontend-school
        run: npm run test:api-contracts

      - name: Check generated API contract artifacts
        working-directory: frontend-school
        run: npm run check:api-contracts

      - name: Test offline OpenAPI export
        working-directory: backend-school
        run: |
          # Reuse the binary built by check:api-contracts; isolate the runtime, not Cargo.
          executable="$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.target_directory')/debug/backend-school"
          env -i PATH="$PATH" HOME="$HOME" "$executable" export-openapi > /tmp/school-api.json
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/school-api.json', 'utf8'))"

  backend:
    name: Backend contract verification
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-contract-rust

      - name: Restore Rust dependency cache
        id: rust_cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: backend-school-contracts
          workspaces: backend-school -> target
          save-if: "false"

      - name: Summarize Rust cache
        if: always()
        env:
          RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
        run: |
          printf '%s\n' \
            '### Rust build cache' \
            '- Shared key: backend-school-contracts' \
            "- Exact cache hit: ${RUST_CACHE_HIT:-false}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check backend formatting
        working-directory: backend-school
        run: cargo fmt --all -- --check

      - name: Test backend API contract
        working-directory: backend-school
        run: cargo test api_contract::tests --bin backend-school

      - name: Test assessment and exam scheduling services
        working-directory: backend-school
        run: cargo test -p school-academic-assessment --lib

      - name: Test exporter logging boundary
        working-directory: backend-school
        run: cargo test structured_logging --test static_architecture

      - name: Check backend
        working-directory: backend-school
        run: cargo check --workspace --all-targets

  frontend:
    name: Frontend contract verification
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLIC_BACKEND_URL: http://localhost:3000
      PUBLIC_VAPID_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-school/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Test frontend API contract
        working-directory: frontend-school
        run: node --test tests/static/api-response-contract.test.mjs

      - name: Check frontend
        working-directory: frontend-school
        run: npm run check

      - name: Lint frontend
        working-directory: frontend-school
        run: npm run lint

  academic-database:
    name: Academic database and migration verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-contract-rust

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: backend-school-contracts
          workspaces: backend-school -> target
          save-if: "false"

      - name: Install native Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Verify rootless Podman
        run: test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Test curriculum migration preservation and refusal
        run: ./scripts/test_backend_school.sh curriculum_revision_schema_tests -- --test-threads=1

      - name: Test Academic Core consumers
        run: ./scripts/test_backend_school.sh modules::academic::core::services_tests -- --test-threads=4

      - name: Test activation and promotion placement
        run: |
          ./scripts/test_backend_school.sh activation_context_tests -- --test-threads=4
          ./scripts/test_backend_school.sh promotion_targets::tests -- --test-threads=4

      - name: Test academic lifecycle consumers
        run: |
          ./scripts/test_backend_school.sh opening_readiness_tests -- --test-threads=4
          ./scripts/test_backend_school.sh promotion_execution_tests -- --test-threads=4

      - name: Test delivery and certificate consumers
        run: |
          ./scripts/test_backend_school.sh curriculum_preview_apply_is_hash_checked_and_closed_terms_reject_writes -- --test-threads=1
          ./scripts/test_backend_school.sh delivery_management_options_are_scoped_and_human_readable -- --test-threads=1
          ./scripts/test_backend_school.sh --integration delivery_versions -- --test-threads=4
          ./scripts/test_backend_school.sh --package school-certificates purge_rejects_admission_logo_and_question_bank_file_consumers -- --test-threads=1

      - name: Test canonical sandbox publication and repeat seeding
        run: BACKEND_SCHOOL_TEST_BIN=seed_sandbox ./scripts/test_backend_school.sh canonical_seed_is_idempotent_across_student_year_and_placement -- --test-threads=1
