name: Admin frontend release implementation
on:
  workflow_call:
    inputs:
      input_hash:
        type: string
        required: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore locked Admin deployment tooling
        uses: ./.github/actions/setup-deployment-tooling
        with:
          component: frontend-admin
      - name: Download prepared Admin frontend
        uses: actions/download-artifact@v7
        with:
          name: prepared-frontend-admin
          path: ${{ runner.temp }}/prepared
      - name: Validate and unpack prepared frontend
        env:
          COMPONENT: frontend-admin
          INPUT_HASH: ${{ inputs.input_hash }}
          ARTIFACT_DIR: ${{ runner.temp }}/prepared
        run: node scripts/frontend_artifact.mjs unpack
      - name: Create environment-specific deployment configuration
        working-directory: frontend-admin
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
        run: |
          set -eu
          : "${BASE_DOMAIN:?BASE_DOMAIN repository variable is required}"
          : "${PUBLIC_API_URL:?BACKEND_ADMIN_URL repository variable is required}"
          jq \
            --arg route "${BASE_DOMAIN}/*" \
            --arg redirect_route "admin.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            --arg admin_api "$PUBLIC_API_URL" \
            'del(.build) + {routes:[{pattern:$route,zone_name:$zone},{pattern:$redirect_route,zone_name:$zone}],vars:{PUBLIC_API_URL:$admin_api}}' \
            wrangler.json >wrangler.deploy.json
      - name: Read locked Wrangler version
        id: wrangler-version
        working-directory: frontend-admin
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages['node_modules/wrangler'].version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid locked Wrangler version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Check whether the Admin Worker exists
        id: admin-worker
        working-directory: frontend-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../scripts/lib/pipeline-admin-worker.mjs
      - name: Create missing Admin Worker with an isolated maintenance response
        if: steps.admin-worker.outputs.bootstrap == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: deploy --config .wrangler/admin-bootstrap.json
      - name: Prepare Worker upload receipt
        working-directory: frontend-admin
        run: |
          mkdir -p .wrangler
          rm -f .wrangler/admin-release-upload.ndjson
      - name: Upload frontend-admin Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: versions upload --config wrangler.deploy.json --tag ${{ github.sha }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/frontend-admin/.wrangler/admin-release-upload.ndjson
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
      - name: Read uploaded Worker version
        id: uploaded-version
        working-directory: frontend-admin
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.deploy.json', 'utf8'));
          const uploads = readFileSync('.wrangler/admin-release-upload.ndjson', 'utf8')
            .split('\n').filter(Boolean).map((line) => JSON.parse(line))
            .filter((entry) => entry.type === 'version-upload');
          if (uploads.length !== 1 || uploads[0].version !== 1 || uploads[0].worker_name !== config.name)
            throw new Error('Expected exactly one upload for the configured Worker');
          const id = uploads[0].version_id;
          if (typeof id !== 'string' || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id))
            throw new Error('Invalid uploaded Worker version ID');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
          NODE
      - name: Promote uploaded frontend-admin Worker and apply routes
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: |
            versions deploy --config wrangler.deploy.json --version-id ${{ steps.uploaded-version.outputs.id }} --percentage 100 --yes
            triggers deploy --config wrangler.deploy.json
      - name: Verify the exact Admin Worker deployment and retain its receipt
        working-directory: frontend-admin
        env:
          EXPECTED_VERSION: ${{ steps.uploaded-version.outputs.id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          set -euo pipefail
          npx wrangler deployments list --config wrangler.deploy.json --json > "$RUNNER_TEMP/admin-active.json"
          jq -e --arg id "$EXPECTED_VERSION" 'sort_by(.created_on // .created_at // "") | last | .versions | length == 1 and ((.[0].version_id // .[0].id) == $id) and .[0].percentage == 100' "$RUNNER_TEMP/admin-active.json" >/dev/null
          jq -n --arg sha "$GITHUB_SHA" --arg versionId "$EXPECTED_VERSION" '{sha:$sha,versionId:$versionId}' > "$RUNNER_TEMP/admin-worker.json"
      - name: Restore locked browser acceptance tooling
        uses: ./.github/actions/setup-deployment-tooling
        with:
          component: frontend-school
      - name: Set up cached Chromium for Admin maintenance acceptance
        uses: ./.github/actions/setup-chromium
      - name: Verify Admin maintenance page and exact prepared assets
        working-directory: frontend-school
        env:
          ADMIN_ORIGIN: https://${{ vars.BASE_DOMAIN }}
        run: node scripts/verify-admin-worker-readiness.mjs
      - uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: admin-worker-${{ github.sha }}
          path: ${{ runner.temp }}/admin-worker.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove temporary upload receipt
        if: always()
        working-directory: frontend-admin
        run: rm -f .wrangler/admin-release-upload.ndjson .wrangler/admin-bootstrap.json .wrangler/admin-bootstrap.mjs
