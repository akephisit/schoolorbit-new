name: Deploy Frontend Admin
run-name: Deploy Frontend Admin (${{ inputs.deployment_id || github.sha }})

on:
  push:
    branches: [main]
    paths:
      - "frontend-admin/**"
      - ".github/workflows/deploy-frontend-admin.yml"
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Installer run identifier"
        required: false
        type: string

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Validate and build frontend
        working-directory: frontend-admin
        env:
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
        run: |
          npm run lint
          npm run check
          npm run build

      - name: Create environment-specific deployment configuration
        working-directory: frontend-admin
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
        run: |
          set -eu
          : "${BASE_DOMAIN:?BASE_DOMAIN repository variable is required}"
          : "${PUBLIC_API_URL:?BACKEND_ADMIN_URL repository variable is required}"
          : "${BACKEND_SCHOOL_URL:?BACKEND_SCHOOL_URL repository variable is required}"
          jq \
            --arg route "admin.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            --arg admin_api "$PUBLIC_API_URL" \
            --arg school_api "$BACKEND_SCHOOL_URL" \
            '. + {routes:[{pattern:$route,zone_name:$zone}],vars:{PUBLIC_API_URL:$admin_api,BACKEND_SCHOOL_URL:$school_api}}' \
            wrangler.json >wrangler.deploy.json

      - name: Read locked Wrangler version
        id: wrangler-version
        working-directory: frontend-admin
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages['node_modules/wrangler'].version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid locked Wrangler version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Prepare versioned Worker secrets
        working-directory: frontend-admin
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, rmSync, writeFileSync } from 'node:fs';
          if (!process.env.INTERNAL_API_SECRET) throw new Error('INTERNAL_API_SECRET is required');
          mkdirSync('.wrangler', { recursive: true });
          rmSync('.wrangler/admin-release-upload.ndjson', { force: true });
          rmSync('.wrangler/admin-release-secrets.json', { force: true });
          writeFileSync('.wrangler/admin-release-secrets.json', JSON.stringify({
            INTERNAL_API_SECRET: process.env.INTERNAL_API_SECRET
          }), { mode: 0o600, flag: 'wx' });
          NODE

      - name: Upload frontend-admin Worker with its secrets
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: versions upload --config wrangler.deploy.json --secrets-file .wrangler/admin-release-secrets.json --tag ${{ github.sha }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/frontend-admin/.wrangler/admin-release-upload.ndjson
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}

      - name: Read uploaded Worker version
        id: uploaded-version
        working-directory: frontend-admin
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.deploy.json', 'utf8'));
          const uploads = readFileSync('.wrangler/admin-release-upload.ndjson', 'utf8')
            .split('\n').filter(Boolean).map((line) => JSON.parse(line))
            .filter((entry) => entry.type === 'version-upload');
          if (uploads.length !== 1 || uploads[0].version !== 1 || uploads[0].worker_name !== config.name)
            throw new Error('Expected exactly one upload for the configured Worker');
          const id = uploads[0].version_id;
          if (typeof id !== 'string' || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id))
            throw new Error('Invalid uploaded Worker version ID');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
          NODE

      - name: Promote uploaded frontend-admin Worker and apply routes
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: |
            versions deploy --config wrangler.deploy.json --version-id ${{ steps.uploaded-version.outputs.id }} --percentage 100 --yes
            triggers deploy --config wrangler.deploy.json

      - name: Remove temporary Worker secrets
        if: always()
        working-directory: frontend-admin
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          rmSync('.wrangler/admin-release-secrets.json', { force: true });
          rmSync('.wrangler/admin-release-upload.ndjson', { force: true });
          NODE
