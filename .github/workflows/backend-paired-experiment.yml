name: Backend Paired Experiment

on:
  push:
    branches: [perf/backend-build-next]
    paths: [.github/workflows/backend-paired-experiment.yml]

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [backend-school, backend-admin]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare stable baseline
        run: |
          mkdir -p "$RUNNER_TEMP/paired-baseline"
          git archive c1134a68 "${{ matrix.backend }}" | tar -x -C "$RUNNER_TEMP/paired-baseline"
      - uses: docker/setup-buildx-action@v4
      - uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/paired-baseline/${{ matrix.backend }}
          target: builder
          load: true
          tags: schoolorbit-paired:builder
          cache-from: type=gha,scope=${{ matrix.backend }}
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Measure profiles and actual linker commands on the same runner
        env:
          BENCH_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paired-results"
          docker create --name schoolorbit-paired --cpus=2 \
            -e BENCH_COMPARE_LINKERS=compare \
            -v "$PWD/scripts/benchmark_backend_build.sh:/benchmark.sh:ro" \
            -v "$RUNNER_TEMP/paired-results:/results" \
            --entrypoint sleep schoolorbit-paired:builder infinity
          trap 'docker rm --force schoolorbit-paired >/dev/null' EXIT
          docker start schoolorbit-paired
          for variant in default opt2 cgu64; do
            docker exec schoolorbit-paired bash /benchmark.sh "$BENCH_BACKEND" "$variant" "/results/$variant"
          done
          for cpus in 1 4; do
            docker update --cpus="$cpus" schoolorbit-paired
            docker exec -e BENCH_SAMPLES=1 schoolorbit-paired bash /benchmark.sh "$BENCH_BACKEND" "cpu$cpus" "/results/cpu$cpus"
          done
          {
            echo "### Same-runner $BENCH_BACKEND paired measurements"
            for variant in default opt2 cgu64 cpu1 cpu4; do
              echo "#### $variant"
              echo '```json'
              cat "$RUNNER_TEMP/paired-results/$variant/result.json"
              echo '```'
              cat "$RUNNER_TEMP/paired-results/$variant/link-nanoseconds.txt.compare"
              cat "$RUNNER_TEMP/paired-results/$variant/link-nanoseconds.txt.driver"
            done
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: paired-${{ matrix.backend }}
          path: ${{ runner.temp }}/paired-results
          retention-days: 7
