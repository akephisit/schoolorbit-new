name: Operations
run-name: Operations ${{ inputs.operation }} (${{ inputs.request_id || github.run_id }})
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operational task; production provisioning uses the shared lock
        type: choice
        default: smoke
        options:
          - provision
          - owned-load-cleanup
          - smoke
          - diagnostics
          - recreate-admin-frontend
          - benchmark
          - cache-benchmark
          - compiler-cache-diagnostic
          - http-benchmark
          - api-dns-only
          - rollback-api-dns
      request_id:
        description: Exact provisioning request identifier
        type: string
        default: ""
      subdomain:
        description: Tenant subdomain
        type: string
        default: sandbox
      school_id:
        description: School UUID for provisioning
        type: string
        default: ""
      api_url:
        description: School API URL; provisioning must match accepted configuration
        type: string
        default: https://school-api.schoolorbit.app
      options:
        description: Optional JSON operation settings, e.g. {"backend":"both","samples":"2"}
        type: string
        default: "{}"
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  owned-load-cleanup:
    if: inputs.operation == 'owned-load-cleanup' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/owned-load-cleanup.yml
    with:
      request_id: ${{ inputs.request_id }}
      subdomain: ${{ inputs.subdomain }}
      school_id: ${{ inputs.school_id }}
      api_url: ${{ inputs.api_url }}
      options: ${{ inputs.options }}
    secrets: inherit
  api-dns:
    if: (inputs.operation == 'api-dns-only' || inputs.operation == 'rollback-api-dns') && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/api-tls.yml
    with:
      mode: ${{ inputs.operation == 'api-dns-only' && 'dns-only' || 'dns-rollback' }}
      rollback_id: ${{ fromJson(inputs.options).rollback_id || '' }}
      resume_id: ${{ fromJson(inputs.options).resume_id || '' }}
    secrets: inherit
  recreate-admin-frontend:
    if: inputs.operation == 'recreate-admin-frontend' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/recreate-admin-frontend.yml
    secrets: inherit
  smoke:
    if: inputs.operation == 'smoke'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
    with:
      subdomain: ${{ fromJson(inputs.options).subdomain || inputs.subdomain }}
      api_url: ${{ fromJson(inputs.options).api_url || inputs.api_url }}
      admin_api_url: ${{ fromJson(inputs.options).admin_api_url || 'https://admin-api.schoolorbit.app' }}
      tenant_url: ${{ fromJson(inputs.options).tenant_url || '' }}
      origin: ${{ fromJson(inputs.options).origin || '' }}
      timeout_seconds: ${{ fromJson(inputs.options).timeout_seconds || '20' }}
      run_authenticated: ${{ fromJson(inputs.options).run_authenticated != false }}
  diagnostics:
    if: inputs.operation == 'diagnostics' && fromJson(inputs.options).bundle_observation != true
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/runtime-diagnostics.yml
    secrets: inherit
    with:
      run_tenant_probe: ${{ fromJson(inputs.options).run_tenant_probe == true }}
      probe_subdomain: ${{ fromJson(inputs.options).probe_subdomain || '' }}
      observe_academic148_curriculum: ${{ fromJson(inputs.options).observe_academic148_curriculum == true }}
  release-bundle-observation:
    if: inputs.operation == 'diagnostics' && fromJson(inputs.options).bundle_observation == true
    permissions:
      contents: read
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe only the fixed failed release bundle without changing host state
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            set -eu
            python3 - <<'PY'
            import hashlib, io, json, os, stat, tarfile

            # Temporary fixed observation; no caller paths, payload output or writes.
            STACK = "/opt/stack"
            SHA = "d4205300fb8fbc042bbc03f1f99b076b40ded093"
            DIGEST = "76befeec174600aa905f5848c63b01ebcf71b14997df8026b8f497180162e3a8"
            RUN = "43120878873-1"
            LIMIT = 16 * 1024 * 1024
            uid = os.getuid()
            rows = {}
            descriptors = []
            def emit(value):
                print(json.dumps(value, sort_keys=True), flush=True)
            def entry(role, parent, name, directory=True):
                if parent is None:
                    rows[role] = {"role": role, "observed": False, "reason": "ancestor_unavailable"}
                    emit(rows[role])
                    return None, None
                try:
                    info = os.stat(name, dir_fd=parent, follow_symlinks=False)
                except OSError as error:
                    rows[role] = {"role": role, "observed": False, "reason": "missing" if isinstance(error, FileNotFoundError) else "stat_refused"}
                    emit(rows[role])
                    return None, None
                kind = "directory" if stat.S_ISDIR(info.st_mode) else "regular" if stat.S_ISREG(info.st_mode) else "symlink" if stat.S_ISLNK(info.st_mode) else "other"
                row = {"role": role, "observed": True, "type": kind,
                       "mode": format(stat.S_IMODE(info.st_mode), "04o"), "uid": info.st_uid, "gid": info.st_gid,
                       "owner_matches": info.st_uid == uid, "mode_safe": not bool(info.st_mode & 0o022),
                       "mode_is_published": stat.S_IMODE(info.st_mode) == 0o555}
                if not directory:
                    row.update(size_bytes=info.st_size, nlink=info.st_nlink)
                rows[role] = row
                emit(row)
                if directory and kind != "directory":
                    return None, info
                if not directory and (kind != "regular" or info.st_uid != uid or info.st_nlink != 1 or not 0 <= info.st_size <= LIMIT):
                    return None, info
                try:
                    flags = os.O_RDONLY | os.O_NOFOLLOW | (os.O_DIRECTORY if directory else 0)
                    fd = os.open(name, flags, dir_fd=parent)
                except OSError:
                    emit({"role": role, "opened": False, "reason": "open_refused"})
                    return None, info
                actual = os.fstat(fd)
                if (actual.st_dev, actual.st_ino, actual.st_mode, actual.st_uid, actual.st_gid, actual.st_nlink, actual.st_size) != (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid, info.st_nlink, info.st_size):
                    os.close(fd)
                    emit({"role": role, "opened": False, "reason": "metadata_changed"})
                    return None, info
                descriptors.append(fd)
                return fd, actual
            try:
                process = {"role": "process", "uid": uid, "gid": os.getgid()}
                with open("/proc/self/status", "r", encoding="ascii") as status:
                    for _ in range(256):
                        line = status.readline(512)
                        if not line:
                            break
                        if line.startswith("Umask:"):
                            mask = int(line.split()[1], 8)
                            process.update(umask=format(mask, "04o"), umask_masks_group_write=bool(mask & 0o020), umask_masks_other_write=bool(mask & 0o002))
                            break
                emit(process)
                root_fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                descriptors.append(root_fd)
                stack_fd = root_fd
                for index, part in enumerate(STACK.strip("/").split("/")):
                    stack_fd, _ = entry("stack_ancestor_" + str(index), stack_fd, part)
                deployment, _ = entry("deployment", stack_fd, "deployment")
                incoming, _ = entry("incoming_root", deployment, "release-bundle-incoming")
                incoming_sha, _ = entry("incoming_sha", incoming, SHA)
                incoming_digest, _ = entry("incoming_digest", incoming_sha, DIGEST)
                incoming_run, _ = entry("incoming_run", incoming_digest, RUN)
                # Inspect archive metadata first. Do not open unsafe file types/owners.
                archive_info = None
                if incoming_run is not None:
                    try:
                        archive_info = os.stat("release-bundle.tar", dir_fd=incoming_run, follow_symlinks=False)
                    except OSError:
                        pass
                safe = archive_info is not None and stat.S_ISREG(archive_info.st_mode) and archive_info.st_uid == uid and archive_info.st_nlink == 1 and 0 <= archive_info.st_size <= LIMIT
                if safe:
                    archive, actual = entry("incoming_archive", incoming_run, "release-bundle.tar", directory=False)
                else:
                    archive = None
                    row = {"role": "incoming_archive", "safe_to_hash": False, "reason": "not_owned_bounded_single_regular_file",
                          "observed": archive_info is not None,
                          "owner_matches": archive_info is not None and archive_info.st_uid == uid,
                          "regular": archive_info is not None and stat.S_ISREG(archive_info.st_mode),
                          "single_link": archive_info is not None and archive_info.st_nlink == 1}
                    if archive_info is not None:
                        row.update(type="regular" if stat.S_ISREG(archive_info.st_mode) else "symlink" if stat.S_ISLNK(archive_info.st_mode) else "other", mode=format(stat.S_IMODE(archive_info.st_mode), "04o"), uid=archive_info.st_uid, gid=archive_info.st_gid, size_bytes=archive_info.st_size, nlink=archive_info.st_nlink)
                    emit(row)
                bundles, _ = entry("published_root", deployment, "release-bundles")
                published_sha, _ = entry("published_sha", bundles, SHA)
                entry("published_bundle", published_sha, DIGEST)
                failures = []
                for role in ["deployment", "incoming_root", "incoming_sha", "incoming_digest", "incoming_run"]:
                    row = rows.get(role, {})
                    if not row.get("observed") or row.get("type") != "directory":
                        failures.append(role + "_type")
                    elif not row["owner_matches"]:
                        failures.append(role + "_owner")
                    elif not row["mode_safe"]:
                        failures.append(role + "_mode")
                emit({"role": "installer_directory_verdict", "pass": not failures, "first_refusal": failures[0] if failures else "none"})
                if archive is None:
                    emit({"role": "archive_verdict", "hashed": False, "parsed": False})
                else:
                    chunks, count = [], 0
                    while count <= LIMIT:
                        chunk = os.read(archive, min(65536, LIMIT + 1 - count))
                        if not chunk:
                            break
                        chunks.append(chunk)
                        count += len(chunk)
                    after = os.fstat(archive)
                    unchanged = (actual.st_dev, actual.st_ino, actual.st_size, actual.st_uid, actual.st_nlink, actual.st_mtime_ns, actual.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_uid, after.st_nlink, after.st_mtime_ns, after.st_ctime_ns)
                    raw = b"".join(chunks)
                    matched = unchanged and count <= LIMIT and hashlib.sha256(raw).hexdigest() == DIGEST
                    emit({"role": "archive_verdict", "hashed": True, "unchanged": unchanged, "digest_matches": matched, "parsed": matched})
                    if matched:
                        with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as source:
                            members = source.getmembers()
                            names = [member.name for member in members]
                            headers = len(members) == 23 and len(set(names)) == len(names) and all(member.isreg() and not member.pax_headers and not member.linkname and member.uid == 0 and member.gid == 0 and member.mode == (0o555 if member.name.endswith(".sh") else 0o444) and 0 <= member.size <= 2 * 1024 * 1024 for member in members)
                            emit({"role": "archive_headers", "member_count": len(members), "headers_match": headers})
                            if headers and "release-bundle.json" in names:
                                def pairs(items):
                                    value = {}
                                    for key, item in items:
                                        if key in value:
                                            raise ValueError("duplicate_json_key")
                                        value[key] = item
                                    return value
                                payload = {member.name: source.extractfile(member).read() for member in members}
                                manifest = json.loads(payload.pop("release-bundle.json"), object_pairs_hook=pairs)
                                expected = [{"path": name, "mode": 0o555 if name.endswith(".sh") else 0o444, "size": len(body), "sha256": hashlib.sha256(body).hexdigest()} for name, body in sorted(payload.items())]
                                emit({"role": "archive_manifest", "schema_matches": set(manifest) == {"schemaVersion", "releaseSha", "files"} and type(manifest["schemaVersion"]) is int and manifest["schemaVersion"] == 1,
                                      "release_matches": manifest.get("releaseSha") == SHA, "files_match": manifest.get("files") == expected})
                emit({"role": "observation", "completed": True, "observation_only": True})
            except Exception:
                emit({"role": "observation", "completed": False, "reason": "bounded_observation_refused"})
            finally:
                for fd in reversed(descriptors):
                    os.close(fd)
            PY
  benchmark:
    if: inputs.operation == 'benchmark'
    uses: ./.github/workflows/backend-build-benchmark.yml
    secrets: inherit
    with:
      backend: ${{ fromJson(inputs.options).backend || 'both' }}
      samples: ${{ fromJson(inputs.options).samples || '2' }}
      variants: ${{ fromJson(inputs.options).variants || 'default,cgu64' }}
      baseline: ${{ fromJson(inputs.options).baseline || '' }}
      profile_only: ${{ fromJson(inputs.options).profile_only == true }}
  http-benchmark:
    if: inputs.operation == 'http-benchmark'
    uses: ./.github/workflows/backend-http-boundary-experiment.yml
    secrets: inherit
    with:
      baseline: ${{ fromJson(inputs.options).baseline || '75b46a688de810cd23c058da26daf4cc93496a35' }}
  cache-benchmark:
    if: inputs.operation == 'cache-benchmark'
    uses: ./.github/workflows/backend-cache-benchmark.yml
    with:
      samples: ${{ fromJson(inputs.options).samples || '2' }}
      phase: ${{ fromJson(inputs.options).phase || 'compare' }}
      producer_run_id: ${{ fromJson(inputs.options).producer_run_id || '' }}
      producer_run_attempt: ${{ fromJson(inputs.options).producer_run_attempt || '' }}
  compiler-cache-diagnostic:
    if: inputs.operation == 'compiler-cache-diagnostic'
    uses: ./.github/workflows/compiler-cache-diagnostic.yml
    with:
      workload: ${{ fromJson(inputs.options).workload || 'probe' }}
  provision:
    if: inputs.operation == 'provision' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-school-tenant.yml
    with:
      subdomain: ${{ inputs.subdomain }}
      school_id: ${{ inputs.school_id }}
      api_url: ${{ inputs.api_url }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
