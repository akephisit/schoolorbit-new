name: Operations
run-name: Operations ${{ inputs.operation }} (${{ inputs.request_id || github.run_id }})
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operational task; production provisioning uses the shared lock
        type: choice
        default: smoke
        options:
          - provision
          - smoke
          - diagnostics
          - benchmark
          - http-benchmark
          - database-cutover
      request_id:
        description: Exact provisioning request identifier
        type: string
        default: ""
      subdomain:
        description: Tenant subdomain
        type: string
        default: sandbox
      school_id:
        description: School UUID for provisioning
        type: string
        default: ""
      api_url:
        description: School API URL; provisioning must match accepted configuration
        type: string
        default: https://school-api.schoolorbit.app
      options:
        description: Optional JSON operation settings, e.g. {"backend":"both","samples":"2"}
        type: string
        default: "{}"
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  database-cutover:
    if: inputs.operation == 'database-cutover' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify current main and its exact-attempt build gate before quiescing writers
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_DEPLOY_ENABLED: ${{ vars.RUNTIME_DEPLOY_ENABLED }}
          FRONTEND_DEPLOY_ENABLED: ${{ vars.FRONTEND_DEPLOY_ENABLED }}
        run: node scripts/postgres_cutover_gate.mjs
      - name: Upload trusted maintenance implementations
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/lib/pipeline-remote/maintenance.sh,scripts/lib/pipeline-remote/postgres-cutover.sh,scripts/render_nginx_config.sh,nginx-configs
          target: /opt/stack/deployment
      - name: Keep the production lock and maintenance during operator data transfer and restore verification
        uses: appleboy/ssh-action@v1.2.5
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DATABASES: ${{ fromJson(inputs.options).databases }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BASE_DOMAIN,RELEASE_SHA,EXPECTED_DATABASES
          command_timeout: 95m
          script: bash /opt/stack/deployment/scripts/lib/pipeline-remote/postgres-cutover.sh
      - name: Refuse a stale main after transfer while retaining maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_DEPLOY_ENABLED: ${{ vars.RUNTIME_DEPLOY_ENABLED }}
          FRONTEND_DEPLOY_ENABLED: ${{ vars.FRONTEND_DEPLOY_ENABLED }}
        run: node scripts/postgres_cutover_gate.mjs
  smoke:
    if: inputs.operation == 'smoke'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
    with:
      subdomain: ${{ fromJson(inputs.options).subdomain || inputs.subdomain }}
      api_url: ${{ fromJson(inputs.options).api_url || inputs.api_url }}
      admin_api_url: ${{ fromJson(inputs.options).admin_api_url || 'https://admin-api.schoolorbit.app' }}
      tenant_url: ${{ fromJson(inputs.options).tenant_url || '' }}
      origin: ${{ fromJson(inputs.options).origin || '' }}
      timeout_seconds: ${{ fromJson(inputs.options).timeout_seconds || '20' }}
      run_authenticated: ${{ fromJson(inputs.options).run_authenticated != false }}
  diagnostics:
    if: inputs.operation == 'diagnostics'
    uses: ./.github/workflows/runtime-diagnostics.yml
    secrets: inherit
  benchmark:
    if: inputs.operation == 'benchmark'
    uses: ./.github/workflows/backend-build-benchmark.yml
    secrets: inherit
    with:
      backend: ${{ fromJson(inputs.options).backend || 'both' }}
      samples: ${{ fromJson(inputs.options).samples || '2' }}
      variants: ${{ fromJson(inputs.options).variants || 'default,cgu64' }}
      baseline: ${{ fromJson(inputs.options).baseline || '' }}
  http-benchmark:
    if: inputs.operation == 'http-benchmark'
    uses: ./.github/workflows/backend-http-boundary-experiment.yml
    secrets: inherit
    with:
      baseline: ${{ fromJson(inputs.options).baseline || '75b46a688de810cd23c058da26daf4cc93496a35' }}
  provision:
    if: inputs.operation == 'provision' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-school-tenant.yml
    with:
      subdomain: ${{ inputs.subdomain }}
      school_id: ${{ inputs.school_id }}
      api_url: ${{ inputs.api_url }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
