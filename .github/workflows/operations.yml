name: Operations
run-name: Operations ${{ inputs.operation }} (${{ inputs.request_id || github.run_id }})
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operational task; production provisioning uses the shared lock
        type: choice
        default: smoke
        options:
          - provision
          - owned-load-cleanup
          - smoke
          - diagnostics
          - recreate-admin-frontend
          - benchmark
          - cache-benchmark
          - compiler-cache-diagnostic
          - http-benchmark
          - api-dns-only
          - rollback-api-dns
      request_id:
        description: Exact provisioning request identifier
        type: string
        default: ""
      subdomain:
        description: Tenant subdomain
        type: string
        default: sandbox
      school_id:
        description: School UUID for provisioning
        type: string
        default: ""
      api_url:
        description: School API URL; provisioning must match accepted configuration
        type: string
        default: https://school-api.schoolorbit.app
      options:
        description: Optional JSON operation settings, e.g. {"backend":"both","samples":"2"}
        type: string
        default: "{}"
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  owned-load-cleanup:
    if: inputs.operation == 'owned-load-cleanup' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/owned-load-cleanup.yml
    with:
      request_id: ${{ inputs.request_id }}
      subdomain: ${{ inputs.subdomain }}
      school_id: ${{ inputs.school_id }}
      api_url: ${{ inputs.api_url }}
      options: ${{ inputs.options }}
    secrets: inherit
  api-dns:
    if: (inputs.operation == 'api-dns-only' || inputs.operation == 'rollback-api-dns') && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/api-tls.yml
    with:
      mode: ${{ inputs.operation == 'api-dns-only' && 'dns-only' || 'dns-rollback' }}
      rollback_id: ${{ fromJson(inputs.options).rollback_id || '' }}
      resume_id: ${{ fromJson(inputs.options).resume_id || '' }}
    secrets: inherit
  recreate-admin-frontend:
    if: inputs.operation == 'recreate-admin-frontend' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/recreate-admin-frontend.yml
    secrets: inherit
  smoke:
    if: inputs.operation == 'smoke'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
    with:
      subdomain: ${{ fromJson(inputs.options).subdomain || inputs.subdomain }}
      api_url: ${{ fromJson(inputs.options).api_url || inputs.api_url }}
      admin_api_url: ${{ fromJson(inputs.options).admin_api_url || 'https://admin-api.schoolorbit.app' }}
      tenant_url: ${{ fromJson(inputs.options).tenant_url || '' }}
      origin: ${{ fromJson(inputs.options).origin || '' }}
      timeout_seconds: ${{ fromJson(inputs.options).timeout_seconds || '20' }}
      run_authenticated: ${{ fromJson(inputs.options).run_authenticated != false }}
  diagnostics:
    if: inputs.operation == 'diagnostics'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/runtime-diagnostics.yml
    secrets: inherit
    with:
      run_tenant_probe: ${{ fromJson(inputs.options).run_tenant_probe == true }}
      probe_subdomain: ${{ fromJson(inputs.options).probe_subdomain || '' }}
      observe_academic148_curriculum: ${{ fromJson(inputs.options).observe_academic148_curriculum == true }}
  benchmark:
    if: inputs.operation == 'benchmark'
    uses: ./.github/workflows/backend-build-benchmark.yml
    secrets: inherit
    with:
      backend: ${{ fromJson(inputs.options).backend || 'both' }}
      samples: ${{ fromJson(inputs.options).samples || '2' }}
      variants: ${{ fromJson(inputs.options).variants || 'default,cgu64' }}
      baseline: ${{ fromJson(inputs.options).baseline || '' }}
      profile_only: ${{ fromJson(inputs.options).profile_only == true }}
  http-benchmark:
    if: inputs.operation == 'http-benchmark'
    uses: ./.github/workflows/backend-http-boundary-experiment.yml
    secrets: inherit
    with:
      baseline: ${{ fromJson(inputs.options).baseline || '75b46a688de810cd23c058da26daf4cc93496a35' }}
  cache-benchmark:
    if: inputs.operation == 'cache-benchmark'
    uses: ./.github/workflows/backend-cache-benchmark.yml
    with:
      samples: ${{ fromJson(inputs.options).samples || '2' }}
  compiler-cache-diagnostic:
    if: inputs.operation == 'compiler-cache-diagnostic'
    uses: ./.github/workflows/compiler-cache-diagnostic.yml
    with:
      workload: ${{ fromJson(inputs.options).workload || 'probe' }}
  provision:
    if: inputs.operation == 'provision' && github.ref == 'refs/heads/main'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-school-tenant.yml
    with:
      subdomain: ${{ inputs.subdomain }}
      school_id: ${{ inputs.school_id }}
      api_url: ${{ inputs.api_url }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
