name: Pipeline
run-name: Pipeline (${{ inputs.deployment_id || github.sha }})
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Add a component or reconcile all; queued changes are always included
        type: choice
        default: auto
        options:
          - auto
          - full
          - backend-admin
          - frontend-admin
          - backend-school
          - frontend-school
      automatic:
        description: Internal automatic integration dispatch; respects rollout gates
        type: boolean
        default: false
      deployment_id:
        description: Installer or operations request identifier
        type: string
      target_origin_ip:
        description: Temporary IPv4 before DNS cutover
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Read trusted accepted baseline
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/pipeline-state.mjs > "$RUNNER_TEMP/state.json"
      - name: Plan local suites and release artifacts
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
          PUBLIC_BACKEND_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          PUBLIC_VAPID_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
            if ! git merge-base --is-ancestor "$base" HEAD^2; then
              echo 'Update your branch from main and rerun affected local tests before merging.' >&2
              exit 1
            fi
            ./scripts/pipeline plan --base "$base" --output "$RUNNER_TEMP/plan.json"
          else
            base=${PUSH_BASE:-$(git rev-parse HEAD)}
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^); fi
            ./scripts/pipeline plan --release true --base "$base" --state "$RUNNER_TEMP/state.json" --scope "$REQUESTED_SCOPE" --output "$RUNNER_TEMP/plan.json"
          fi
          cat "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$PR_NUMBER" ]; then
            node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const file=process.env.RUNNER_TEMP+'/plan.json';
          const plan=JSON.parse(readFileSync(file,'utf8'));
          plan.prHead=execFileSync('git',['rev-parse','HEAD^2'],{encoding:'utf8'}).trim();
          writeFileSync(file,JSON.stringify(plan));
          appendFileSync(process.env.GITHUB_OUTPUT,'plan='+JSON.stringify(plan)+'\n');
          NODE
          fi
      - uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: pipeline-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 30
  prepare:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.build != '[]'
    uses: ./.github/workflows/prepare.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
  gate:
    name: Pipeline gate
    needs:
      - plan
      - prepare
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful planning and every selected build
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILDS: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          if [ "$BUILDS" != '[]' ]; then test "$PREPARE_RESULT" = success; fi
  release:
    needs:
      - plan
      - gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.deploy != '[]'
    concurrency:
      group: schoolorbit-production
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      target_origin_ip: ${{ inputs.target_origin_ip || '' }}
      automatic: ${{ github.event_name == 'push' || inputs.automatic == true }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: write
