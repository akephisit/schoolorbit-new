name: Rust compiler cache diagnostic
on:
  workflow_call:
    inputs:
      workload:
        type: string
        default: probe
permissions:
  contents: read
  packages: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate bounded compiler workload
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          case "$WORKLOAD" in probe|dependencies) ;; *) exit 64 ;; esac
      - uses: docker/setup-buildx-action@v4
        if: inputs.workload == 'dependencies'
      - uses: docker/login-action@v4
        if: inputs.workload == 'dependencies'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Expose compiler cache runtime
        uses: actions/github-script@v8
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            if (!token || !process.env.ACTIONS_RESULTS_URL) throw new Error('Cache runtime is unavailable');
            core.setSecret(token);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
      - name: Probe compiler writes and restoration in fresh containers
        env:
          COMPILER_CACHE_OUTPUT: ${{ runner.temp }}/compiler-cache-evidence
          COMPILER_CACHE_WORKLOAD: ${{ inputs.workload }}
        run: python3 -B scripts/diagnose_compiler_cache.py
      - name: Publish allowlisted compiler evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-cache-evidence
          path: ${{ runner.temp }}/compiler-cache-evidence/evidence.json
          retention-days: 7
          if-no-files-found: error
