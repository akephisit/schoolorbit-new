name: Backend HTTP Boundary Benchmark
on:
  workflow_call:
    inputs:
      baseline:
        description: Commit before the HTTP crate extraction
        type: string
        required: false
        default: 75b46a688de810cd23c058da26daf4cc93496a35
permissions:
  contents: read
jobs:
  compare-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare pinned baseline
        env:
          BENCH_BASELINE: ${{ inputs.baseline }}
        run: |
          mkdir -p "$RUNNER_TEMP/http-baseline"
          baseline_commit=$(git rev-parse --verify --end-of-options "$BENCH_BASELINE^{commit}")
          git archive "$baseline_commit" backend-school | tar -x -C "$RUNNER_TEMP/http-baseline"
          printf 'Baseline: %s\nCandidate: %s\n' "$baseline_commit" "$GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v4
      - name: Configure compiler cache transport
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Restore baseline production builder
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/http-baseline/backend-school
          target: builder
          load: true
          tags: schoolorbit-http-boundary:builder
          cache-from: type=gha,scope=backend-school
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Compare two samples per source case on one runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/http-boundary-results"
          docker run --rm --cpus=2 \
            -v "$PWD/scripts/benchmark_http_boundaries.sh:/benchmark.sh:ro" \
            -v "$PWD/backend-school:/candidate:ro" \
            -v "$RUNNER_TEMP/http-boundary-results:/results" \
            --entrypoint bash schoolorbit-http-boundary:builder /benchmark.sh
          {
            echo '### HTTP boundary comparison: two samples, same runner and 2 CPU quota'
            echo 'Warm Cargo compilation; initial graph priming is recorded separately.'
            echo '```json'
            cat "$RUNNER_TEMP/http-boundary-results/result.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-http-boundary-comparison
          path: ${{ runner.temp }}/http-boundary-results
          retention-days: 7
