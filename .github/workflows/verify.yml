name: Scoped verification
on:
  workflow_call:
    inputs:
      suites:
        type: string
        required: true
      sha:
        type: string
        required: true
      candidate:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  reuse:
    runs-on: ubuntu-24.04
    outputs:
      remaining: ${{ steps.proof.outputs.remaining }}
      reused: ${{ steps.proof.outputs.reused }}
      prime: ${{ steps.proof.outputs.prime }}
      proof: ${{ steps.proof.outputs.proof }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Reuse only proven equivalent PR verification
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SUITES: ${{ inputs.suites }}
          CANDIDATE: ${{ inputs.candidate }}
        run: node scripts/reuse_pipeline_verification.mjs
  verify:
    name: Verify ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.reuse.outputs.remaining) }}
    env:
      PUBLIC_BACKEND_URL: http://localhost:3000
      PUBLIC_VAPID_KEY: test
      PUBLIC_API_URL: http://localhost:8080
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend-school/package-lock.json
            frontend-admin/package-lock.json
      - name: Set up pinned Rust
        if: startsWith(matrix.suite, 'backend-')
        uses: ./.github/actions/setup-contract-rust
      - name: Select compatible Rust cache identity
        id: rust-key
        if: startsWith(matrix.suite, 'backend-')
        env:
          RUST_COMPONENT: ${{ matrix.suite }}
        run: node scripts/rust_ci_cache.mjs key
      - name: Restore compiled Rust inputs
        id: rust-cache
        if: startsWith(matrix.suite, 'backend-')
        uses: actions/cache/restore@v5
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.suite }}/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Validate unchanged source freshness
        if: startsWith(matrix.suite, 'backend-')
        env:
          RUST_COMPONENT: ${{ matrix.suite }}
        run: node scripts/rust_ci_cache.mjs restore
      - name: Install School verification dependencies
        if: matrix.suite != 'documentation' && matrix.suite != 'backend-admin' && matrix.suite != 'frontend-admin'
        working-directory: frontend-school
        run: npm ci
      - name: Install Admin frontend dependencies
        if: matrix.suite == 'frontend-admin'
        working-directory: frontend-admin
        run: npm ci
      - name: Install deployment checker tools
        if: matrix.suite == 'deployment' || matrix.suite == 'frontend-school'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck shfmt gettext-base jq
      - name: Run owned local and CI verification
        env:
          PRIME: ${{ contains(fromJson(needs.reuse.outputs.prime), matrix.suite) }}
          PR_VERIFICATION_PROOF: ${{ needs.reuse.outputs.proof }}
        run: |
          if [[ "$PRIME" == true ]]; then
            ./scripts/pipeline prime --scope "${{ matrix.suite }}"
          else
            ./scripts/pipeline verify --scope "${{ matrix.suite }}"
          fi
      - name: Record tested Rust sources
        if: startsWith(matrix.suite, 'backend-') && github.ref == 'refs/heads/main' && !inputs.candidate
        env:
          RUST_COMPONENT: ${{ matrix.suite }}
        run: node scripts/rust_ci_cache.mjs save
      - name: Save the main-owned compiled snapshot
        if: startsWith(matrix.suite, 'backend-') && github.ref == 'refs/heads/main' && !inputs.candidate && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.suite }}/target
          key: ${{ steps.rust-key.outputs.key }}
      - name: Record cache outcome separately from verification
        if: always() && startsWith(matrix.suite, 'backend-')
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf 'Compiler cache exact hit=%s; inspect command timings for actual reused work.\n' "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Record actual verification environment
        env:
          VERIFICATION_SUITE: ${{ matrix.suite }}
          PRIME: ${{ contains(fromJson(needs.reuse.outputs.prime), matrix.suite) }}
          PR_VERIFICATION_PROOF: ${{ needs.reuse.outputs.proof }}
        run: node scripts/verification_evidence.mjs
      - uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: verification-${{ matrix.suite }}
          path: ${{ runner.temp }}/verification-${{ matrix.suite }}.json
          retention-days: 30
          if-no-files-found: error
    needs: reuse
    if: needs.reuse.outputs.remaining != '[]'
  complete:
    needs:
      - reuse
      - verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed or proven reusable verification
        env:
          PROOF_RESULT: ${{ needs.reuse.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REMAINING: ${{ needs.reuse.outputs.remaining }}
        run: |-
          set -euo pipefail
          test "$PROOF_RESULT" = success
          if [ "$REMAINING" != '[]' ]; then test "$VERIFY_RESULT" = success; fi
