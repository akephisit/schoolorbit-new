name: Prepare immutable release artifacts
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    name: Prepare ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(inputs.plan).build }}
    env:
      SCHOOLORBIT_BUILD_ID: ${{ fromJson(inputs.plan).hashes[matrix.component] }}
      COMPONENT: ${{ matrix.component }}
      INPUT_HASH: ${{ fromJson(inputs.plan).hashes[matrix.component] }}
      PUBLIC_BACKEND_URL: ${{ vars.BACKEND_SCHOOL_URL }}
      PUBLIC_VAPID_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      PUBLIC_API_URL: ${{ vars.BACKEND_ADMIN_URL }}
      BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: startsWith(matrix.component, 'frontend-')
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - name: Restore frontend artifact cache
        if: startsWith(matrix.component, 'frontend-')
        id: bundle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ matrix.component }}/build
            ${{ matrix.component }}/.pipeline-build.json
          key: bundle-linux-amd64-node24-${{ matrix.component }}-${{ env.INPUT_HASH }}
      - name: Build selected frontend artifact
        if: startsWith(matrix.component, 'frontend-') && steps.bundle-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-frontend-bundle
        with:
          component: ${{ matrix.component }}
      - name: Bind frontend cache and artifact to verified inputs
        if: startsWith(matrix.component, 'frontend-')
        run: node scripts/frontend_artifact.mjs pack
      - name: Prime the shared locked deployment tooling
        if: startsWith(matrix.component, 'frontend-')
        uses: ./.github/actions/setup-deployment-tooling
        with:
          component: ${{ matrix.component }}
          seed: "true"
      - name: Save main-owned frontend artifact cache
        if: startsWith(matrix.component, 'frontend-') && github.ref == 'refs/heads/main' && steps.bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ matrix.component }}/build
            ${{ matrix.component }}/.pipeline-build.json
          key: ${{ steps.bundle-cache.outputs.cache-primary-key }}
      - name: Publish prepared frontend artifact
        if: startsWith(matrix.component, 'frontend-')
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: prepared-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/${{ matrix.component }}.tar
            ${{ runner.temp }}/${{ matrix.component }}.json
          retention-days: 90
          if-no-files-found: error
      - uses: docker/login-action@v4
        if: startsWith(matrix.component, 'backend-')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        if: startsWith(matrix.component, 'backend-')
      - name: Find exact reusable OCI inputs
        if: startsWith(matrix.component, 'backend-')
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/schoolorbit-${COMPONENT}"
          reference="${image}:input-${INPUT_HASH}"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found|404 Not Found' "$RUNNER_TEMP/inspect.err"; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          printf 'repository=%s\nreference=%s\n' "$image" "$reference" >> "$GITHUB_OUTPUT"
      - name: Expose compiler cache runtime through BuildKit secrets
        if: startsWith(matrix.component, 'backend-') && steps.image.outputs.reused != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
      - name: Build selected OCI image
        id: image-build
        if: startsWith(matrix.component, 'backend-') && steps.image.outputs.reused != 'true'
        uses: ./.github/actions/build-backend-image
        with:
          component: ${{ matrix.component }}
          reference: ${{ steps.image.outputs.reference }}
          input_hash: ${{ env.INPUT_HASH }}
      - name: Export compiler evidence
        if: startsWith(matrix.component, 'backend-') && steps.image.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          target: build-timings
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/timings-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          build-args: SCHOOL_COMPILER_CACHE=gha
          secret-envs: |
            sccache_gha_url=ACTIONS_RESULTS_URL
            sccache_gha_token=ACTIONS_RUNTIME_TOKEN
      - name: Publish compiler evidence
        if: startsWith(matrix.component, 'backend-') && steps.image.outputs.reused != 'true'
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: cargo-timings-${{ matrix.component }}
          path: ${{ runner.temp }}/timings-${{ matrix.component }}
          retention-days: 14
          if-no-files-found: error
      - name: Summarize build phases and compiler reuse
        if: startsWith(matrix.component, 'backend-') && steps.image.outputs.reused != 'true'
        env:
          BUILD_METADATA: ${{ steps.image-build.outputs.metadata }}
        run: |
          set -euo pipefail
          build_ref=$(python3 -c 'import json,os; print(json.loads(os.environ["BUILD_METADATA"]).get("buildx.build.ref", ""))')
          log="$RUNNER_TEMP/buildkit-${COMPONENT}.log"
          if [[ "$build_ref" == */*/* ]]; then
            builder=${build_ref%%/*}
            record=${build_ref##*/}
            if ! docker buildx --builder "$builder" history logs --progress=plain "$record" >"$log" 2>&1; then
              printf '::warning::BuildKit phase logs are unavailable; compiler artifact remains available.\n'
            fi
          fi
          python3 scripts/render_backend_build_summary.py "$COMPONENT" "$RUNNER_TEMP/timings-${COMPONENT}" "$log" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind selected image digest to this release
        if: startsWith(matrix.component, 'backend-')
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE: ${{ steps.image.outputs.repository }}
          REUSED: ${{ steps.image.outputs.reused }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$REFERENCE" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}@${digest}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          jq -n --arg component "$COMPONENT" --arg sha "$GITHUB_SHA" --arg inputHash "$INPUT_HASH" --arg digest "$digest" \
            '{schemaVersion:1,component:$component,sha:$sha,inputHash:$inputHash,digest:$digest}' > "$RUNNER_TEMP/${COMPONENT}.json"
          printf 'OCI exact-input reuse=%s; digest=%s\n' "$REUSED" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=OCI input reuse::%s reused=%s\n' "$COMPONENT" "$REUSED"
      - name: Publish immutable OCI manifest
        if: startsWith(matrix.component, 'backend-')
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: prepared-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.json
          retention-days: 90
          if-no-files-found: error
