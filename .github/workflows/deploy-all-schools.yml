name: Deploy Frontend School to All Tenants
run-name: Deploy Frontend Schools (${{ inputs.deployment_id || github.sha }})

on:
  # Trigger เมื่อ push ไป main และมีการแก้ไข frontend-school
  push:
    branches:
      - main
    paths:
      - "frontend-school/**"
      - "scripts/discover_school_tenants.sh"
      - ".github/workflows/deploy-all-schools.yml"

  # หรือ trigger manual
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy to all schools"
        required: false
        default: "false"
      deployment_id:
        description: "Installer run identifier"
        required: false
        type: string

jobs:
  get-schools:
    if: github.event_name == 'workflow_dispatch' || vars.FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      schools: ${{ steps.fetch-schools.outputs.schools }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Wait for File Platform-ready backend
        env:
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
        run: |
          set -eu
          for attempt in $(seq 1 180); do
            readiness="$(
              curl --fail --silent --show-error --max-time 10 \
                "${BACKEND_SCHOOL_URL%/}/ready" 2>/dev/null || true
            )"
            if printf '%s' "$readiness" \
              | jq -e '.status == "ready" and .filePlatform == "ready"' >/dev/null
            then
              echo "Backend File Platform is ready"
              exit 0
            fi
            if [ "$attempt" -lt 180 ]; then
              sleep 10
            fi
          done
          echo "Backend File Platform did not become ready before frontend deployment"
          exit 1

      - name: Fetch school list from API
        id: fetch-schools
        env:
          BACKEND_ADMIN_URL: ${{ vars.BACKEND_ADMIN_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: bash scripts/discover_school_tenants.sh

  deploy:
    needs: get-schools
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: needs.get-schools.outputs.schools != '[]' && needs.get-schools.outputs.schools != ''
    strategy:
      matrix:
        school: ${{ fromJson(needs.get-schools.outputs.schools) }}
      max-parallel: 3 # Deploy สูงสุด 3 โรงเรียนพร้อมกัน
      fail-fast: false # ถ้า deploy โรงเรียนใดล้มเหลว ให้ deploy โรงเรียนอื่นต่อ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-school/package-lock.json

      - name: Install dependencies
        working-directory: frontend-school
        run: npm ci

      - name: Create Wrangler configuration
        working-directory: frontend-school
        env:
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          BACKEND_SCHOOL_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          set -eu
          : "${BASE_DOMAIN:?BASE_DOMAIN repository variable is required}"
          : "${BACKEND_SCHOOL_URL:?BACKEND_SCHOOL_URL repository variable is required}"
          jq -n \
            --arg name "schoolorbit-school-${SUBDOMAIN}" \
            --arg route "${SUBDOMAIN}.${BASE_DOMAIN}/*" \
            --arg zone "$BASE_DOMAIN" \
            --arg backend "$BACKEND_SCHOOL_URL" \
            --arg vapid "$VAPID_PUBLIC_KEY" \
            --arg subdomain "$SUBDOMAIN" \
            '{name:$name,main:"build/index.js",compatibility_date:"2025-09-15",compatibility_flags:["nodejs_compat"],assets:{directory:"build/client",binding:"ASSETS"},routes:[{pattern:$route,zone_name:$zone}],vars:{PUBLIC_BACKEND_URL:$backend,PUBLIC_VAPID_KEY:$vapid,SUBDOMAIN:$subdomain}}' \
            >wrangler.json

      - name: Build frontend
        working-directory: frontend-school
        env:
          PUBLIC_BACKEND_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
          PUBLIC_VAPID_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-school
          command: deploy

      - name: Synchronize menu routes
        working-directory: frontend-school
        env:
          PUBLIC_BACKEND_URL: ${{ vars.BACKEND_SCHOOL_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SUBDOMAIN: ${{ matrix.school.subdomain }}
        run: npm run sync:menu-routes

      - name: Report deployment status
        if: success()
        run: |
          echo "✅ Successfully deployed ${{ matrix.school.subdomain }}"
          echo "URL: https://${{ matrix.school.subdomain }}.${{ vars.BASE_DOMAIN }}"

      - name: Report deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed for ${{ matrix.school.subdomain }}"

  summary:
    needs: [get-schools, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment summary
        run: |
          SCHOOLS='${{ needs.get-schools.outputs.schools }}'
          SCHOOL_COUNT=$(echo "$SCHOOLS" | jq '. | length')
          echo "🎉 Deployment completed!"
          echo "Schools processed: $SCHOOL_COUNT"
