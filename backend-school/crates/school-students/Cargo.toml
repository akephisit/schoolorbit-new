[package]
name = "school-students"
version.workspace = true
edition.workspace = true

[features]
api-docs = [
    "school-calendar/api-docs",
    "school-academic-timetable/api-docs",
    "school-academic-assessment/api-docs",
    "school-http/api-docs",
    "school-auth/api-docs",
    "dep:utoipa",
    "school-academic-core/api-docs",
]

[dependencies]
school-tenancy = { workspace = true }
school-database = { workspace = true }
school-calendar = { workspace = true }
school-academic-timetable = { workspace = true }
school-academic-assessment = { workspace = true }
school-permissions = { workspace = true }
school-authorization = { workspace = true }
school-http = { workspace = true }
school-auth-http = { workspace = true }
school-auth = { workspace = true }
axum = { workspace = true }
bcrypt = { workspace = true }
chrono = { workspace = true }
school-academic-core = { workspace = true }
school-crypto = { workspace = true }
school-errors = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
school-test-db = { workspace = true }
tokio = { workspace = true }
school-crypto = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
