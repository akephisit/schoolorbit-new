[package]
name = "school-notifications"
version.workspace = true
edition.workspace = true

[features]
test-support = ["school-tenancy/test-support"]
api-docs = [
    "school-http/api-docs",
    "school-auth/api-docs",
    "dep:utoipa",
]

[dependencies]
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
school-permissions = { workspace = true }
school-authorization = { workspace = true }
school-http = { workspace = true }
school-auth-http = { workspace = true }
school-auth = { workspace = true }
school-tenancy = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
school-errors = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
web-push = { workspace = true }

[dev-dependencies]
school-auth = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
