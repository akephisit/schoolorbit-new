[package]
name = "school-staff-http"
version.workspace = true
edition.workspace = true

[features]
api-docs = [
    "dep:utoipa",
    "school-auth/api-docs",
    "school-http/api-docs",
    "school-staff/api-docs",
    "school-staff-file-transfer/api-docs",
    "school-staff-leave/api-docs",
]

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
school-auth = { workspace = true }
school-auth-http = { workspace = true }
school-authorization = { workspace = true }
school-errors = { workspace = true }
school-file-platform = { workspace = true }
school-http = { workspace = true }
school-notifications = { workspace = true }
school-permissions = { workspace = true }
school-staff = { workspace = true }
school-staff-file-transfer = { workspace = true }
school-staff-leave = { workspace = true }
school-tenancy = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
school-auth = { workspace = true, features = ["test-support"] }
school-test-db = { workspace = true }

[lints]
workspace = true
