[workspace]
members = [
    "crates/school-budget",
    "crates/school-student-care",
    "crates/school-files-http",
    "crates/school-administration",
    "crates/school-attendance",
    "crates/school-behavior",
    "crates/school-academic-http",
    "crates/school-certificates-http",
    "crates/school-auth-http",
    "crates/school-notifications",
    "crates/school-navigation",
    "crates/school-errors",
    "crates/school-http",
    "crates/school-authorization",
    "crates/school-auth",
    "crates/school-academic-core",
    "crates/school-academic-delivery",
    "crates/school-academic-timetable",
    "crates/school-academic-assessment",
    "crates/school-academic-results",
    "crates/school-academic-lifecycle",
    "crates/school-workflow",
    "crates/school-question-bank",
    "crates/school-admission",
    "crates/school-supervision",
    "crates/school-students",
    "crates/school-staff",
    "crates/school-calendar",
    "crates/school-crypto",
    "crates/school-test-db",
    "crates/school-tenancy",
    "crates/school-file-platform",
    "crates/school-fonts",
    "crates/school-certificates",
    "crates/school-migrations",
    "crates/school-permissions",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"

[workspace.dependencies]
school-budget = { path = "crates/school-budget" }
school-student-care = { path = "crates/school-student-care" }
rustybuzz = "0.20.1"
school-files-http = { path = "crates/school-files-http" }
school-administration = { path = "crates/school-administration" }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
aws-config = "1.13.0"
aws-credential-types = "1.3.1"
# The `rustls` compatibility feature enables the obsolete Hyper 0.14 / Rustls 0.21 client.
# Keep the current default HTTPS client and the remaining SDK defaults explicitly.
aws-sdk-s3 = { version = "1.154.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["std", "zeroize"] }
bigdecimal = { version = "0.4.11", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
http = "1.5.0"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
ipnet = "2.12.2"
lopdf = { version = "0.46.0", default-features = false }
mime_guess = "2.0.5"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "bigdecimal", "json", "tls-native-tls"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tokio-stream = "0.1.19"
tower = "0.5.3"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.28.0", features = ["serde", "v4", "v5", "v7"] }
web-push = "0.11.0"
zeroize = { version = "1.9.1", features = ["derive"] }
school-permissions = { path = "crates/school-permissions" }
school-migrations = { path = "crates/school-migrations" }
school-errors = { path = "crates/school-errors" }
school-http = { path = "crates/school-http" }
school-authorization = { path = "crates/school-authorization" }
school-auth = { path = "crates/school-auth" }
school-academic-core = { path = "crates/school-academic-core" }
school-academic-delivery = { path = "crates/school-academic-delivery" }
school-academic-timetable = { path = "crates/school-academic-timetable" }
school-academic-assessment = { path = "crates/school-academic-assessment" }
school-academic-results = { path = "crates/school-academic-results" }
school-academic-lifecycle = { path = "crates/school-academic-lifecycle" }
school-workflow = { path = "crates/school-workflow" }
school-question-bank = { path = "crates/school-question-bank" }
school-admission = { path = "crates/school-admission" }
school-supervision = { path = "crates/school-supervision" }
school-students = { path = "crates/school-students" }
school-staff = { path = "crates/school-staff" }
school-calendar = { path = "crates/school-calendar" }
school-crypto = { path = "crates/school-crypto" }
school-test-db = { path = "crates/school-test-db" }
school-tenancy = { path = "crates/school-tenancy" }
school-file-platform = { path = "crates/school-file-platform" }
school-fonts = { path = "crates/school-fonts" }
school-certificates = { path = "crates/school-certificates" }

school-navigation = { path = "crates/school-navigation" }

school-notifications = { path = "crates/school-notifications" }

school-auth-http = { path = "crates/school-auth-http" }

school-certificates-http = { path = "crates/school-certificates-http" }

school-academic-http = { path = "crates/school-academic-http" }

school-attendance = { path = "crates/school-attendance" }

school-behavior = { path = "crates/school-behavior" }

[package]
name = "backend-school"
version.workspace = true
edition.workspace = true

[features]
api-docs = [
    "school-budget/api-docs",
    "school-student-care/api-docs",
    "school-workflow/api-docs",
    "school-files-http/api-docs",
    "school-administration/api-docs",
    "dep:utoipa",
    "school-academic-assessment/api-docs",
    "school-academic-core/api-docs",
    "school-academic-delivery/api-docs",
    "school-academic-http/api-docs",
    "school-academic-lifecycle/api-docs",
    "school-academic-results/api-docs",
    "school-academic-timetable/api-docs",
    "school-admission/api-docs",
    "school-attendance/api-docs",
    "school-auth/api-docs",
    "school-auth-http/api-docs",
    "school-behavior/api-docs",
    "school-calendar/api-docs",
    "school-certificates-http/api-docs",
    "school-certificates/api-docs",
    "school-file-platform/api-docs",
    "school-fonts/api-docs",
    "school-http/api-docs",
    "school-navigation/api-docs",
    "school-notifications/api-docs",
    "school-question-bank/api-docs",
    "school-staff/api-docs",
    "school-students/api-docs",
    "school-supervision/api-docs",
]

[dependencies]
school-budget = { workspace = true }
school-student-care = { workspace = true }
school-files-http = { workspace = true }
