    "crates/school-academic-results-http",
    "crates/school-academic-lifecycle-http",
    "crates/school-academic-realtime",
    "crates/school-certificates-http",
    "crates/school-auth-context",
    "crates/school-auth-http",
    "crates/school-notifications",
    "crates/school-notifications-http",
    "crates/school-navigation",
