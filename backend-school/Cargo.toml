school-question-bank = { path = "crates/school-question-bank" }
school-question-bank-http = { path = "crates/school-question-bank-http" }
school-admission = { path = "crates/school-admission" }
school-admission-http = { path = "crates/school-admission-http" }
school-supervision = { path = "crates/school-supervision" }
school-supervision-http = { path = "crates/school-supervision-http" }
school-students = { path = "crates/school-students" }
school-students-http = { path = "crates/school-students-http" }
