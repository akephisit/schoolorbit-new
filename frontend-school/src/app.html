<!doctype html>
<html lang="th" data-school-font-pending="true">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/favicon.png" />

		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Theme Color -->
		<meta name="theme-color" content="#4f46e5" />

		<!-- Mobile Web App -->
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="192x192" href="/app-icon/192.png" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="SchoolOrbit" />

		<link rel="stylesheet" href="/school-appearance.css" />
		<link rel="stylesheet" href="/school-appearance-fonts.css" />
		<style>
			html {
				font-family: var(--school-font-family, system-ui, sans-serif);
				background: var(--background, #edf2f1);
			}
			html[data-school-font-pending='true'] body {
				visibility: hidden;
				animation: school-font-deadline 4s step-end forwards;
			}
			@keyframes school-font-deadline {
				to {
					visibility: visible;
					--school-font-family: system-ui, sans-serif;
					font-family: system-ui, sans-serif;
				}
			}
		</style>
		<noscript
			><style>
				html[data-school-font-pending='true'] body {
					visibility: visible;
				}
				html {
					--school-font-family: system-ui, sans-serif;
				}
			</style></noscript
		>
		<script id="school-appearance-bootstrap">
			(function () {
				var root = document.documentElement;
				var startedAt = performance.now();
				// Adapt the existing personal preference before any UI or loader paints.
				var preference = 'system';
				try {
					var stored = JSON.parse(localStorage.getItem('ui-preferences') || 'null');
					if (
						stored &&
						(stored.theme === 'dark' || stored.theme === 'light' || stored.theme === 'system')
					)
						preference = stored.theme;
				} catch (_) {
					/* Use the existing system default when storage is unavailable. */
				}
				var publicPage = location.pathname === '/' || location.pathname.indexOf('/login') === 0;
				root.classList.toggle(
					'dark',
					!publicPage &&
						(preference === 'dark' ||
							(preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
				);
				var chrome = document.querySelector('meta[name="theme-color"]');
				if (chrome)
					chrome.setAttribute(
						'content',
						getComputedStyle(root).getPropertyValue('--background').trim()
					);
				var selected = getComputedStyle(root).getPropertyValue('--school-font-family').trim();
				var finished = false;
				function reveal(fallback) {
					if (finished) return;
					finished = true;
					fallback = fallback || performance.now() - startedAt >= 3000;
					if (fallback) {
						root.style.setProperty('--school-font-family', 'system-ui, sans-serif');
						root.dataset.schoolFontFallback = 'true';
					}
					root.dataset.schoolFontPending = 'false';
				}
				var timer = setTimeout(function () {
					reveal(true);
				}, 3000);
				if (!document.fonts || !selected) {
					clearTimeout(timer);
					reveal(true);
					return;
				}
				var family = selected.split(',')[0];
				Promise.all(
					[400, 500, 600, 700].map(function (weight) {
						return document.fonts
							.load(weight + ' 16px ' + family, 'กขคง SchoolOrbit 0123456789')
							.then(function (faces) {
								if (!faces.length) throw new Error('School font unavailable');
							});
					})
				).then(
					function () {
						clearTimeout(timer);
						reveal(false);
					},
					function () {
						clearTimeout(timer);
						reveal(true);
					}
				);
			})();
		</script>
		<!-- schoolorbit-route-preview-meta -->
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
