<!doctype html>
<html lang="th" data-school-font-pending="true">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/favicon.png" />

		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Theme Color -->
		<meta name="theme-color" content="#4f46e5" />

		<!-- Mobile Web App -->
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="192x192" href="/app-icon/192.png" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="SchoolOrbit" />

		<link rel="stylesheet" href="/school-appearance.css" />
		<link rel="stylesheet" href="/school-appearance-fonts.css" />
		<style>
			html {
				font-family: var(--school-font-family, system-ui, sans-serif);
				background: var(--background, #f6f7f3);
			}
			html[data-school-font-pending='true'] body {
				visibility: hidden;
				animation: school-font-deadline 4s step-end forwards;
			}
			@keyframes school-font-deadline {
				to {
					visibility: visible;
					font-family: system-ui, sans-serif;
				}
			}
		</style>
		<noscript
			><style>
				html[data-school-font-pending='true'] body {
					visibility: visible;
				}
				html {
					--school-font-family: system-ui, sans-serif;
				}
			</style></noscript
		>
		<script src="/school-appearance-bootstrap.js"></script>
		<!-- schoolorbit-route-preview-meta -->
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
