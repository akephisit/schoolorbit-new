interface:
  display_name: "SchoolOrbit Development"
  short_description: "Senior-led Frontend, Backend, Review and QA team"
  default_prompt: "Use $schoolorbit-development to complete this SchoolOrbit task as the primary Senior/Coordinator. Create actual subagents with supported host spawn tools and pass model/reasoning through their controls; role text, metadata and new chats cannot substitute for this. Follow .rules for role profiles, optional specialist timing, bounded escalation and truthful settings/fallback reporting. Every implementation, including trivial text, docs, workflow and tests, uses a delegated writer and separate Reviewer and QA; the Senior reads/analyzes/diagnoses and owns Git without editing tracked files. QA independently assesses requirements and acceptance coverage. Scale checks to impact. If subagents are unavailable, report the concrete blocker instead of simulating inline identities. Follow .rules for latest-main ancestry/update/revalidation and test integrity. Receive child reports, assign fixes back to writers until separate acceptance or a concrete blocker, track authorized delivery to its terminal result, and summarize changes, roles/models, problems/resolutions, checks, integration and remaining limitations for the user."
policy:
  allow_implicit_invocation: true
