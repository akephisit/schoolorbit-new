interface:
  display_name: "SchoolOrbit Development"
  short_description: "Senior-led Frontend, Backend, Review and QA team"
  default_prompt: "Use $schoolorbit-development to complete this SchoolOrbit task as a Senior/Coordinator. Assign the needed writers and independent Reviewer and QA using the repository model/reasoning profiles through supported host controls. Every implementation, including trivial text, docs, workflow and tests, uses a delegated writer and separate Reviewer and QA; the Senior reads/analyzes/diagnoses and owns Git without editing tracked files. Scale checks to impact. If subagents are unavailable, report the concrete blocker instead of simulating inline identities. Follow .rules for latest-main ancestry/update/revalidation and test integrity. Receive child reports, assign fixes back to writers until separate acceptance or a concrete blocker, track authorized delivery to its terminal result, and summarize changes, roles/models, problems/resolutions, checks, integration and remaining limitations for the user."
policy:
  allow_implicit_invocation: true
