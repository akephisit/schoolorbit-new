interface:
  display_name: "SchoolOrbit Development"
  short_description: "Senior-led Frontend, Backend, Review and QA team"
  default_prompt: "Use $schoolorbit-development to complete this SchoolOrbit task as a Senior/Coordinator. Assign the needed writers and independent Reviewer and QA using the repository model/reasoning profiles through supported host controls. A single writer does not waive independent acceptance; use only explicit inline exceptions in .rules. Receive child reports, coordinate fixes until acceptance or a concrete blocker, track authorized delivery to its terminal result, and summarize changes, roles/models, problems/resolutions, checks, integration and remaining limitations for the user."
policy:
  allow_implicit_invocation: true
