[package]
name = "backend-admin"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
tower-cookies = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json", "tls-native-tls"] }
sha2 = "0.11.1"
bcrypt = { version = "0.19.3", default-features = false, features = ["std", "zeroize"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4", "v7"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
subtle = "2.6.1"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hex = "0.4.3"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
log = "0.4.34"
